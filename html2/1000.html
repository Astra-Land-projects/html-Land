<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1000 Projects — Celebration</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at 50% 40%, #251900 0%, #0b0b0b 45%, #020202 100%);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.container {
    position: relative;
    z-index: 5;
    text-align: center;
    width: min(900px, 92%);
    padding: 45px 25px;
}

.badge {
    display: inline-block;
    padding: 9px 18px;
    border: 1px solid #d8a928;
    border-radius: 999px;
    color: #ffd75a;
    font-size: 14px;
    letter-spacing: 3px;
    margin-bottom: 25px;
    box-shadow: 0 0 20px rgba(255, 194, 45, .2);
}

h1 {
    font-size: clamp(55px, 13vw, 145px);
    line-height: .85;
    font-weight: 900;
    letter-spacing: -7px;
    background: linear-gradient(
        180deg,
        #fff6b0 0%,
        #ffd43b 35%,
        #c78b00 70%,
        #fff1a1 100%
    );
    -webkit-background-clip: text;
    color: transparent;
    text-shadow: 0 0 40px rgba(255, 190, 30, .25);
}

.subtitle {
    margin-top: 25px;
    font-size: clamp(20px, 4vw, 34px);
    font-weight: 700;
}

.subtitle span {
    color: #ffd43b;
}

.message {
    margin: 18px auto 30px;
    max-width: 650px;
    color: #aaa;
    font-size: 17px;
    line-height: 1.7;
}

.stats {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin: 25px 0;
}

.stat {
    min-width: 145px;
    padding: 17px 22px;
    border: 1px solid rgba(255,215,80,.25);
    border-radius: 18px;
    background: rgba(255,255,255,.035);
    backdrop-filter: blur(10px);
}

.stat strong {
    display: block;
    color: #ffd43b;
    font-size: 27px;
    margin-bottom: 5px;
}

.stat small {
    color: #999;
}

button {
    margin-top: 15px;
    padding: 16px 34px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    color: #171100;
    background: linear-gradient(135deg, #fff09a, #ffbf00);
    font-size: 16px;
    font-weight: 800;
    box-shadow: 0 0 25px rgba(255, 193, 7, .35);
    transition: .25s;
}

button:hover {
    transform: scale(1.07);
    box-shadow: 0 0 45px rgba(255, 193, 7, .6);
}

.footer {
    margin-top: 30px;
    color: #666;
    font-size: 13px;
    letter-spacing: 2px;
}

#flash {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 20;
}

@keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.03); }
}

h1 {
    animation: pulse 3s ease-in-out infinite;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>
<div id="flash"></div>

<div class="container">

    <div class="badge">MISSION COMPLETE • MILESTONE 1000</div>

    <h1>1000</h1>

    <div class="subtitle">
        <span>PROJECTS</span> CREATED.
    </div>

    <p class="message">
        One thousand ideas turned into projects.
        One thousand steps of learning, building, breaking,
        fixing, and creating.
        <br><br>
        This isn't the end. It's the next level.
    </p>

    <div class="stats">
        <div class="stat">
            <strong>1,000</strong>
            <small>Projects</small>
        </div>

        <div class="stat">
            <strong>∞</strong>
            <small>Ideas</small>
        </div>

        <div class="stat">
            <strong>1</strong>
            <small>Creator</small>
        </div>
    </div>

    <button onclick="celebrate()">
        🎉 CELEBRATE 1000 🎉
    </button>

    <div class="footer">
        BUILT WITH CODE • CURIOSITY • CREATIVITY
    </div>

</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const flash = document.getElementById("flash");

let W, H;
let particles = [];
let fireworks = [];

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();

class Particle {
    constructor(x, y, color, power = 1) {
        this.x = x;
        this.y = y;

        const angle = Math.random() * Math.PI * 2;
        const speed = (Math.random() * 7 + 3) * power;

        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;

        this.life = 1;
        this.decay = Math.random() * .012 + .008;
        this.size = Math.random() * 3 + 1;
        this.color = color;
        this.gravity = .075;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.vx *= .985;
        this.vy *= .985;
        this.life -= this.decay;
    }

    draw() {
        ctx.globalAlpha = Math.max(this.life, 0);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

class Firework {
    constructor() {
        this.x = Math.random() * W;
        this.y = H + 10;

        this.targetY = Math.random() * H * .55 + 80;

        this.vy = -(Math.random() * 8 + 11);

        this.color = [
            "#ffd43b",
            "#fff2a1",
            "#ffffff",
            "#ffb300",
            "#f7d774"
        ][Math.floor(Math.random() * 5)];

        this.exploded = false;
    }

    update() {
        this.y += this.vy;
        this.vy += .12;

        if (this.vy >= 0 && !this.exploded) {
            this.explode();
            this.exploded = true;
        }
    }

    explode() {
        for (let i = 0; i < 100; i++) {
            particles.push(
                new Particle(this.x, this.y, this.color, .8)
            );
        }
    }

    draw() {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
        ctx.fill();
    }
}

function celebrate() {

    flash.style.transition = "opacity .1s";
    flash.style.opacity = ".8";

    setTimeout(() => {
        flash.style.transition = "opacity 1s";
        flash.style.opacity = "0";
    }, 100);

    for (let i = 0; i < 12; i++) {
        setTimeout(() => {
            fireworks.push(new Firework());
        }, i * 150);
    }

    for (let i = 0; i < 500; i++) {
        const colors = [
            "#ffd43b",
            "#ffffff",
            "#ffb300",
            "#fff2a1"
        ];

        particles.push(
            new Particle(
                Math.random() * W,
                Math.random() * H * .65,
                colors[Math.floor(Math.random() * colors.length)],
                1.3
            )
        );
    }
}

function animate() {

    ctx.fillStyle = "rgba(2,2,2,.18)";
    ctx.fillRect(0, 0, W, H);

    fireworks.forEach((fw, index) => {
        fw.update();
        fw.draw();

        if (fw.exploded) {
            fireworks.splice(index, 1);
        }
    });

    particles.forEach((p, index) => {
        p.update();
        p.draw();

        if (p.life <= 0) {
            particles.splice(index, 1);
        }
    });

    requestAnimationFrame(animate);
}

animate();

// Automatic celebration when page opens
setTimeout(celebrate, 700);
setTimeout(celebrate, 3000);
</script>

</body>
</html>
