<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>معرفی گپ‌جی‌پی‌تی</title>
    <style>
        body { background: #050505; color: #00ffcc; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; padding: 50px; }
        .orb { width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, #00ffcc, #003366); box-shadow: 0 0 50px #00ffcc; margin-bottom: 30px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        .box { border: 1px solid #00ffcc; padding: 20px; width: 80%; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="orb"></div>
    <div class="box">
        <h2>سلام، من GapGPT هستم!</h2>
        <p id="typewriter">من یک هوش مصنوعی هستم که با قدرت GPT-5.6 کار می‌کنم. من برنامه‌نویس، تصویرساز و دستیار همه‌کاره تو هستم.</p>
    </div>
    <script>
        // افکت تایپ ساده
        const text = document.getElementById('typewriter').innerText;
        document.getElementById('typewriter').innerText = "";
        let i = 0;
        function type() {
            if (i < text.length) {
                document.getElementById('typewriter').innerText += text.charAt(i);
                i++;
                setTimeout(type, 50);
            }
        }
        type();
    </script>
</body>
</html>
