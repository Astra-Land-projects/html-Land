<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive Galaxy</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090d;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%}.ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;pointer-events:none}.title{margin-top:7vh;font-size:clamp(34px,7vw,72px);font-weight:800;letter-spacing:-3px;text-shadow:0 0 35px #8cff5a44}.title span{color:#9dff4f}.hint{margin-top:10px;color:#8b929e;font-size:13px}.panel{position:absolute;bottom:6vh;left:50%;transform:translateX(-50%);width:min(720px,86vw);padding:14px 16px;border:1px solid #ffffff16;background:#0d1119cc;backdrop-filter:blur(18px);border-radius:18px;pointer-events:auto;box-shadow:0 20px 70px #0008}.row{display:flex;gap:10px;align-items:center}.row button{border:1px solid #ffffff16;background:#151b25;color:#b9c0ca;border-radius:12px;padding:10px 14px;cursor:pointer}.row button.active,.row button:hover{background:#9dff4f;color:#071006;border-color:#9dff4f}.slider{flex:1}.slider input{width:100%}.badge{font-size:12px;color:#777f8c;min-width:80px;text-align:right}.touch{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:auto}
</style></head><body><canvas id="c"></canvas><div class="touch" id="touch"></div><div class="ui"><div class="title">Interactive <span>Galaxy</span></div><div class="hint">Move your pointer or finger through the galaxy</div><div class="panel"><div class="row"><button class="active" data-mode="swirl">SWIRL</button><button data-mode="orbit">ORBIT</button><button data-mode="explode">EXPLODE</button><div class="slider"><input id="energy" type="range" min="0" max="2" step="0.01" value="1"></div><div class="badge" id="readout">ENERGY 100%</div></div></div></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let w,h,dpr,pts=[],mx=innerWidth/2,my=innerHeight/2,tx=mx,ty=my,mode='swirl',energy=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);make()}
function make(){pts=[];let n=Math.min(15000,Math.floor(w*h/95));for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,r=Math.pow(Math.random(),.55)*Math.min(w,h)*.43;let arm=(i%5)/5*Math.PI*2;let bend=r*.018;let ang=arm+bend+(Math.random()-.5)*.5;pts.push({x:Math.cos(ang)*r,y:Math.sin(ang)*r*.62,z:Math.random(),a:ang,r,seed:Math.random()*10,s:Math.random()*1.8+.3});}}
function pointer(x,y){tx=x;ty=y} addEventListener('resize',resize);document.getElementById('touch').addEventListener('pointermove',e=>pointer(e.clientX,e.clientY));document.getElementById('touch').addEventListener('pointerdown',e=>{pointer(e.clientX,e.clientY);mode='explode';document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));setTimeout(()=>{mode='swirl';document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))},650)});
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b))});document.getElementById('energy').oninput=e=>{energy=+e.target.value;document.getElementById('readout').textContent='ENERGY '+Math.round(energy*100)+'%'};
function draw(t){requestAnimationFrame(draw);mx+=(tx-mx)*.035;my+=(ty-my)*.035;ctx.fillStyle='rgba(3,5,9,.18)';ctx.fillRect(0,0,w,h);let cx=w/2,cy=h/2;let grad=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.min(w,h)*.5);grad.addColorStop(0,'rgba(255,115,40,.12)');grad.addColorStop(.25,'rgba(180,45,80,.035)');grad.addColorStop(1,'transparent');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);for(let p of pts){let ang=p.a + t*.00010*energy*(p.r/Math.min(w,h)) + Math.sin(t*.001+p.seed)*.002;let rr=p.r*(1+Math.sin(t*.0007+p.seed)*.015);let x=Math.cos(ang)*rr, y=Math.sin(ang)*rr*.62;let px=cx+x,py=cy+y;let dx=mx-px,dy=my-py,dist=Math.hypot(dx,dy),influence=Math.max(0,1-dist/220);if(mode==='swirl'){ang+=influence*.8*energy;px=cx+Math.cos(ang)*rr;py=cy+Math.sin(ang)*rr*.62}else if(mode==='orbit'){let q=.3*influence*energy;px+=-dy*q;py+=dx*q}else if(mode==='explode'){let q=influence*180*energy;px+=dx/(dist||1)*q;py+=dy/(dist||1)*q}let glow=0.45+p.z*.8+influence*1.6;ctx.fillStyle=`rgba(${180+Math.floor(75*p.z)},${75+Math.floor(100*p.z)},${80+Math.floor(80*p.z)},${Math.min(1,glow)})`;ctx.fillRect(px,py,p.s,p.s)}let core=ctx.createRadialGradient(cx,cy,0,cx,cy,75);core.addColorStop(0,'rgba(255,210,120,.8)');core.addColorStop(.08,'rgba(255,90,45,.35)');core.addColorStop(1,'transparent');ctx.fillStyle=core;ctx.fillRect(cx-100,cy-100,200,200)}resize();requestAnimationFrame(draw);
</script></body></html>
