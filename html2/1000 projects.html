<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1000 Projects</title>
<style>
:root{--bg:#140e08;--dim:#3a2a1a;--gold:#ffc766;--amber:#ff9d3c;--text:#fff3e0;--mute:#b9a68d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 16px;pointer-events:none}
#n{font-size:clamp(5rem,26vw,12rem);line-height:1;margin:0;font-weight:700;color:var(--gold);text-shadow:0 0 40px rgba(255,157,60,.55);font-variant-numeric:tabular-nums}
#n.done{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{text-shadow:0 0 80px rgba(255,199,102,.95)}}
h2{margin:6px 0 10px;font-size:clamp(1.2rem,5vw,1.8rem);font-weight:400;letter-spacing:.12em}
p{margin:0 0 22px;color:var(--mute);max-width:30em;line-height:1.6}
#grid{display:grid;grid-template-columns:repeat(40,1fr);gap:3px;width:min(92vw,520px);margin-bottom:26px}
#grid i{aspect-ratio:1;border-radius:50%;background:var(--dim);transition:background .3s,box-shadow .3s}
#grid i.on{background:var(--gold);box-shadow:0 0 6px var(--amber)}
button{pointer-events:auto;font:600 1rem system-ui,sans-serif;border:0;border-radius:12px;padding:13px 22px;cursor:pointer;color:#1b1109;background:linear-gradient(90deg,var(--gold),var(--amber))}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<main>
  <h1 id="n" style="font-size:inherit">0</h1>
  <h2>PROJECTS BUILT</h2>
  <p>One project at a time, one thousand times. Every line of code got you here. Project #1001 starts now.</p>
  <div id="grid" aria-hidden="true"></div>
  <button id="again">Celebrate again</button>
</main>
<script>
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const n = document.getElementById("n");
const grid = document.getElementById("grid");
let W = 0, H = 0, P = [], last = 0, finished = false;

function resize() {
  W = cv.width = innerWidth;
  H = cv.height = innerHeight;
  ctx.fillStyle = "#140e08";
  ctx.fillRect(0, 0, W, H);
}
resize();
addEventListener("resize", resize);

function burst(x, y) {
  const hue = 25 + Math.random() * 35;
  for (let i = 0; i < 70; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * 5 + 1;
    P.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, hue });
  }
}
function randomBurst() {
  burst(W * (0.15 + Math.random() * 0.7), H * (0.12 + Math.random() * 0.4));
}
function loop() {
  ctx.fillStyle = "rgba(20,14,8,0.22)";
  ctx.fillRect(0, 0, W, H);
  for (const p of P) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.05;
    p.vx *= 0.985;
    p.life -= 0.012;
    ctx.fillStyle = "hsla(" + p.hue + ",100%,65%," + Math.max(p.life, 0) + ")";
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
    ctx.fill();
  }
  P = P.filter(p => p.life > 0);
  requestAnimationFrame(loop);
}
loop();

for (let i = 0; i < 1000; i++) grid.appendChild(document.createElement("i"));
const dots = grid.children;

function finale() {
  finished = true;
  n.classList.add("done");
  for (let i = 0; i < 6; i++) setTimeout(randomBurst, i * 250);
}
function count() {
  finished = false;
  last = 0;
  n.classList.remove("done");
  for (const d of dots) d.classList.remove("on");
  const t0 = performance.now();
  const D = 4500;
  (function step(t) {
    const k = Math.min(Math.max((t - t0) / D, 0), 1);
    const v = Math.round((1 - Math.pow(1 - k, 3)) * 1000);
    n.textContent = v;
    for (; last < v; last++) dots[last].classList.add("on");
    if (k < 1) requestAnimationFrame(step); else finale();
  })(t0);
}
addEventListener("pointerdown", e => burst(e.clientX, e.clientY));
document.getElementById("again").onclick = count;
setInterval(() => { if (finished && !document.hidden) randomBurst(); }, 1300);
count();
</script>
</body>
</html>
