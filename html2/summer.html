<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آخرین روز تابستون 🌅</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    overflow: hidden;
    background: #0a0a1a;
    font-family: 'Tahoma', system-ui, sans-serif;
    height: 100vh;
    cursor: pointer;
    user-select: none;
  }
  canvas { display: block; }
  #ui {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 24px;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }
  h1 {
    font-size: clamp(1.6rem, 5vw, 2.8rem);
    text-align: center;
    opacity: 0.95;
    letter-spacing: -0.5px;
  }
  .subtitle {
    text-align: center;
    font-size: 1.1rem;
    opacity: 0.8;
    margin-top: 8px;
  }
  #msg {
    text-align: center;
    font-size: clamp(1rem, 3vw, 1.4rem);
    max-width: 600px;
    margin: 0 auto;
    line-height: 1.6;
    background: rgba(0,0,0,0.25);
    padding: 16px 24px;
    border-radius: 16px;
    backdrop-filter: blur(6px);
  }
  #hint {
    text-align: center;
    font-size: 0.95rem;
    opacity: 0.7;
  }
  .heart {
    position: absolute;
    font-size: 22px;
    pointer-events: none;
    animation: floatUp 2.5s ease-out forwards;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-120px) scale(1.4); opacity: 0; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div>
    <h1>آخرین روز تابستون 🌅</h1>
    <div class="subtitle">خداحافظ گرما... سلام پاییز</div>
  </div>
  <div id="msg">کلیک کن تا آخرین پرتوهای آفتاب رو بفرستی به آسمون</div>
  <div id="hint">کلیک کن • لمس کن • لحظه رو حس کن</div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, time = 0;
const particles = [];
const waves = [];
const stars = [];
const messages = [
  "تابستون رفت، ولی خاطره‌هاش موندن ☀️",
  "آخرین غروبِ گرم... لذت ببر",
  "پاییز داره میاد، ولی هنوز یه کم آفتاب هست",
  "یادت باشه: هر پایان، یه شروع جدیده 🍂",
  "خداحافظ شن‌های گرم و موج‌های آبی",
  "این آخرین پرتوها رو با خودت ببر",
  "تابستون تموم شد، ولی تو هنوز می‌درخشی ✨"
];
let msgIndex = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  initWaves();
  initStars();
}
window.addEventListener('resize', resize);
resize();

function initWaves() {
  waves.length = 0;
  for (let i = 0; i < 4; i++) {
    waves.push({
      y: H * 0.72 + i * 18,
      amp: 12 + i * 4,
      speed: 0.02 + i * 0.008,
      phase: Math.random() * Math.PI * 2,
      color: `rgba(30, 100, 180, ${0.25 - i * 0.04})`
    });
  }
}

function initStars() {
  stars.length = 0;
  for (let i = 0; i < 80; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.55,
      r: Math.random() * 1.4 + 0.3,
      a: Math.random()
    });
  }
}

class Particle {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 3;
    this.vy = -Math.random() * 4 - 2;
    this.life = 1;
    this.decay = 0.008 + Math.random() * 0.01;
    this.size = Math.random() * 4 + 2;
    this.hue = 20 + Math.random() * 40; // نارنجی تا زرد
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.04;
    this.life -= this.decay;
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, 90%, 60%, ${this.life})`;
    ctx.fill();
  }
}

function drawSky() {
  // گرادیان آسمان از آبی تیره به نارنجی غروب
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  const t = (Math.sin(time * 0.3) + 1) * 0.5; // کمی تغییر دینامیک
  grad.addColorStop(0, `rgb(${10 + t*10}, ${10 + t*15}, ${40 + t*20})`);
  grad.addColorStop(0.4, `rgb(${40 + t*30}, ${20 + t*20}, ${60 + t*20})`);
  grad.addColorStop(0.7, `rgb(${180 + t*40}, ${80 + t*30}, ${40})`);
  grad.addColorStop(1, `rgb(${220}, ${120}, ${40})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawSun() {
  const sunY = H * 0.55 + Math.sin(time * 0.4) * 8;
  const sunX = W * 0.5;
  const r = Math.min(W, H) * 0.12;

  // هاله
  const glow = ctx.createRadialGradient(sunX, sunY, r * 0.3, sunX, sunY, r * 2.5);
  glow.addColorStop(0, 'rgba(255, 200, 80, 0.45)');
  glow.addColorStop(0.5, 'rgba(255, 140, 40, 0.15)');
  glow.addColorStop(1, 'rgba(255, 100, 20, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(sunX, sunY, r * 2.5, 0, Math.PI * 2);
  ctx.fill();

  // خود خورشید
  const sunGrad = ctx.createRadialGradient(sunX - r*0.3, sunY - r*0.3, 0, sunX, sunY, r);
  sunGrad.addColorStop(0, '#fff8c0');
  sunGrad.addColorStop(0.6, '#ffb040');
  sunGrad.addColorStop(1, '#ff6020');
  ctx.fillStyle = sunGrad;
  ctx.beginPath();
  ctx.arc(sunX, sunY, r, 0, Math.PI * 2);
  ctx.fill();
}

function drawWaves() {
  waves.forEach((w, i) => {
    ctx.beginPath();
    ctx.moveTo(0, w.y);
    for (let x = 0; x <= W; x += 8) {
      const y = w.y + Math.sin(x * 0.01 + time * w.speed + w.phase) * w.amp;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fillStyle = w.color;
    ctx.fill();
  });
}

function drawStars() {
  stars.forEach(s => {
    const twinkle = 0.4 + Math.sin(time * 2 + s.x) * 0.3;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 255, 240, ${s.a * twinkle})`;
    ctx.fill();
  });
}

function drawHorizonGlow() {
  const g = ctx.createLinearGradient(0, H * 0.5, 0, H * 0.75);
  g.addColorStop(0, 'rgba(255, 120, 40, 0)');
  g.addColorStop(0.5, 'rgba(255, 90, 30, 0.15)');
  g.addColorStop(1, 'rgba(255, 60, 20, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, H * 0.5, W, H * 0.3);
}

function animate() {
  time += 0.016;
  drawSky();
  drawStars();
  drawHorizonGlow();
  drawSun();
  drawWaves();

  // ذرات
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw();
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  requestAnimationFrame(animate);
}

function spawn(x, y) {
  for (let i = 0; i < 18; i++) {
    particles.push(new Particle(x, y));
  }
  // قلب شناور
  const heart = document.createElement('div');
  heart.className = 'heart';
  heart.textContent = ['☀️','🌅','✨','💛','🌊'][Math.floor(Math.random()*5)];
  heart.style.left = x + 'px';
  heart.style.top = y + 'px';
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 2600);

  // پیام تصادفی
  msgIndex = (msgIndex + 1) % messages.length;
  document.getElementById('msg').textContent = messages[msgIndex];
}

canvas.addEventListener('click', e => spawn(e.clientX, e.clientY));
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  spawn(t.clientX, t.clientY);
}, { passive: false });

animate();

// پیام اولیه بعد از چند ثانیه
setTimeout(() => {
  document.getElementById('msg').textContent = messages[0];
}, 1500);
</script>
</body>
</html>
