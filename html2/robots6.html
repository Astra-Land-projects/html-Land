<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GapGPT — هوش مصنوعی من ��</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Tahoma, "Segoe UI", sans-serif;
    background: #050510;
    color: #e0e7ff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 18px;
    overflow-x: hidden;
  }
  .orb {
    width: 120px; height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #7c3aed, #2563eb 55%, #0ea5e9);
    box-shadow: 0 0 60px rgba(99,102,241,.8), inset 0 0 30px rgba(255,255,255,.25);
    animation: pulse 3s ease-in-out infinite;
    margin-bottom: 24px;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); box-shadow: 0 0 40px rgba(99,102,241,.6); }
    50%     { transform: scale(1.08); box-shadow: 0 0 90px rgba(56,189,248,.9); }
  }
  h1 {
    font-size: clamp(30px, 7vw, 56px);
    background: linear-gradient(90deg, #38bdf8, #a78bfa, #f472b6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 6px;
  }
  .tagline { color: #94a3b8; font-size: 17px; margin-bottom: 26px; text-align: center; }
  .terminal {
    width: 100%; max-width: 640px;
    background: #0b1120;
    border: 1px solid #1e3a8a;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(37,99,235,.25);
    margin-bottom: 26px;
  }
  .term-bar {
    background: #111a33;
    padding: 9px 14px;
    display: flex;
    gap: 7px;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .r { background: #f87171; } .y { background: #fbbf24; } .g { background: #34d399; }
  .term-body {
    padding: 18px;
    font-family: Consolas, monospace;
    direction: ltr;
    text-align: left;
    font-size: 15px;
    line-height: 1.8;
    min-height: 120px;
    white-space: pre-wrap;
  }
  .term-body .cursor {
    display: inline-block;
    width: 9px; height: 18px;
    background: #38bdf8;
    vertical-align: middle;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .skills {
    display: chips;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    max-width: 640px;
    margin-bottom: 30px;
  }
  .chip {
    background: rgba(59,130,246,.12);
    border: 1px solid rgba(59,130,246,.45);
    border-radius: 50px;
    padding: 8px 18px;
    font-size: 14px;
    transition: all .25s;
    cursor: default;
  }
  .chip:hover {
    background: rgba(59,130,246,.3);
    transform: translateY(-3px);
    box-shadow: 0 0 16px rgba(59,130,246,.5);
  }
  .chat {
    width: 100%; max-width: 640px;
    background: #0b1120;
    border:a;
    padding: 18px;;
    border-radius: 14px;
    padding: 18px;
  }
  .chat h2 { font-size: 18px; color: #7dd3fc; margin-bottom: 12px; }
  #log { min-height: 120px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .bubble { max-width: 82%; padding: 10px 15px; border-radius: 14px; font-size: 15px; line-height: 1.8; }
  .user { align-self: flex-start; background: #1d4ed8; border-bottom-left-radius: 4px; }
  .bot  { align-self: flex-end;  background: #1e293b; border-bottom-right-radius: 4px; }
  .chat-row { display: flex; gap: 10px; }
  .chat-row input {
    flex: 1;
    background: #0f172a;
    border-radius: 10px;
    color: #e0e7ff;
    padding: 11px 14px;
    font-family: inherit;
    font-size: 15px;
    outline: none;
  }
  .chat-row input:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56,189,248,.35); }
  .chat-row button {
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 11px 22px;
    font-family: inherit;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: transform .15s;
  }
  .chat-row button:hover { transform: scale(1.06); }
</style>
</head>
<body>
  <div class="orb"></div>
  <h1>سلام، من GapGPT هستم ��</h1>
  <div class="tagline">یک هوش مصنوعی که فارسی را مثل آب خوردن حرف می‌زند — بدون تحریم‌شکن، با مدل‌های متنوع</div>

  <div class="terminal">
    <div class="term-bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="term-body"><span id="typed"></span><span class="cursor"></span></div>
  </div>

  <div class="skills">
    <span class="chip">�� چت فارسی و انگلیسی</span>
    <span class="chip">�� تولید عکس</span>
    <span class="chip">�� تحلیل فایل PDF و تصویر</span>
    <span class="chip">�� جستجوی هوشمند اینترنت</span>
    <span class="chip">⚡ دسترسی بدون تحریم‌شکن</span>
  </div>

  <div class="chat">
    <h2>�� دمو: با من چت کن!</h2>
    <div id="log"></div>
    <div class="chat-row">
      <input id="inp" type="text" placeholder="یک پیام بنویس..." onkeydown="if(event.key==='Enter')send()">
      <button onclick="send()">بفرست</button>
    </div>
  </div>

<script>
  // ترمینال تایپ‌شونده
  const lines = [
    "$ gapt --init\n",
    "> در حال بارگذاری مدل‌های هوش مصنوعی...\n",
    "> GPT ✔  Claude ✔  Gemini ✔\n",
    "> زبان: فارسی | حالت: خفن ��\n",
    "> آماده‌ام. بگو چیکار کنم!"
  ];
  const typedEl = document.getElementById("typed");
  let li = 0, ci = 0;
  function type() {
    if (li >= lines.length) return;
    typedEl.textContent += lines[li][ci];
    if (ci < lines[li].length - 1) { ci++; setTimeout(type, 28); }
    else { li++; ci = 0; setTimeout(type, 450); }
  }
  type();

  // دموی چت با پاسخ‌های محلی
  const log = document.getElementById("log");
  const replies = [
    "خوشحالم که اینجایی! بپرس تا جواب بدم ��",
    "سوال خوبیه! من یک دموی ساده‌ام، ولی نسخه‌ی واقعی من خیلی قدرتمندتره ��",
    "می‌تونم متن بنویسم، عکس بسازم، فایل تحلیل کنم و تو اینترنت جستجو کنم ��",
    "فارسی، انگلیسی و هر زبانی که بلد باشی، من هستم ��",
    "این دمو کاملاً آفلاین داخل همین یک فایل HTML اجرا می‌شه — بدون نصب هیچ چیزی! ⚡"
  ];
  let ri = 0;
  function send() {
    const inp = document.getElementById("inp");
    const text = inp.value.trim();
    if (!text) return;
    addBubble(text, "user");
    inp.value = "";
    setTimeout(() => {
      addBubble(replies[ri % replies.length], "bot");
      ri++;
    }, 550);
  }
  function addBubble(text, who) {
    const b = document.createElement("\div");
    b.className = "bubble " + who;
    b.textContent = text;
    log.appendChild(b);
    log.scrollTop = log.scrollHeight;
  }
</script>
</body>
</html>
