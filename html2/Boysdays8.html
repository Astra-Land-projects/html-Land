<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👑 روز پسر مبارک 👑</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Tahoma, "Segoe UI", sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #0d1b3e 0%, #1a2f5e 50%, #0d1b3e 100%);
    color: #f5e6c8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    overflow-x: hidden;
  }
  h1 {
    font-size: clamp(28px, 6vw, 52px);
    color: #ffd700;
    text-shadow: 0 0 18px rgba(255, 215, 0, .55);
    margin-bottom: 10px;
    animation: glow 2s ease-in-out infinite alternate;
  }
  @keyframes glow {
    from { text-shadow: 0 0 8px rgba(255,215,0,.35); }
    to   { text-shadow: 0 0 25px rgba(255,215,0,.8); }
  }
  .crown { font-size: clamp(50px, 10vw, 90px); animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  .card {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,215,0,.4);
    border-radius: 18px;
    padding: 26px 30px;
    max-width: 520px;
    width: 100%;
    margin: 22px 0;
    backdrop-filter: blur(6px);
    box-shadow: 0 8px 32px rgba(0,0,0,.35);
  }
  .card p { font-size: 18px; line-height: 2; min-height: 72px; }
  button {
    font-family: inherit;
    font-size: 17px;
    font-weight: bold;
    color: #0d1b3e;
    background: linear-gradient(135deg, #ffd700, #f0a500);
    border: none;
    border-radius: 50px;
    padding: 14px 40px;
    cursor: pointer;
    transition: transform .2s, box-shadow .2s;
    box-shadow: 0 6px 18px rgba(255,215,0,.35);
  }
  button:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 10px 26px rgba(255,215,0,.55); }
  button:active { transform: scale(.97); }
  .small { margin-top: 14px; font-size: 14px; opacity: .75; }
  .confetti {
    position: fixed;
    top: -12px;
    font-size: 18px;
    pointer-events: none;
    animation: fall linear forwards;
    z-index: 99;
  }
  @keyframes fall {
    to { transform: translateY(105vh) rotate(720deg); opacity: .1; }
  }
</style>
</head>
<body>
  <div class="crown">👑</div>
  <h1>روز پسر مبارک!</h1>
  <div class="card">
    <p id="msg">برای شروع، دکمه‌ی پایین رو بزن تا یک پیام مخصوص امروز بگیری ✨</p>
  </div>
  <button onclick="celebrate()">🎉 بزن بریم جشن!</button>
  <div class="small">ساخته‌شده با ❤️ — تک‌فایل، بدون نصب، فقط HTML</div>

<script>
  const messages = [
    "پسر یعنی تکیه‌گاه، یعنی غرور خانواده 🛡️",
    "مرد بودن یعنی وقتی همه می‌سنجند، تو می‌مانی ⚔️",
    "هر روزت روزِ پسر مبارک، چون وقتی پشتته، دنیا پشتشه 💪",
    "به امید آینده‌ای که با دست‌های خودت می‌سازی 🌟",
    "یادت باشه: پسرهای خوب، ستون‌های آینده‌ان 🏛️",
    "قدرت تو تو دلته، نه تو قدت؛ همیشه بلند شو 🔥",
    "تو همون پسری هستی که خدا به خاطرش می‌گه: بنده‌ی من ❤️"
  ];
  const emojis = ["🎉","✨","🎊","⭐","🎈","💛","🥳"];
  let idx = 0;

  function celebrate() {
    // پیام بعدی
    const p = document.getElementById("msg");
    p.textContent = messages[idx % messages.length];
    idx++;
    // کانفتی
    for (let i = 0; i < 40; i++) spawnConfetti();
  }

  function spawnConfetti() {
    const c = document.createElement("div");
    c.className = "confetti";
    c.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    c.style.left = Math.random() * 100 + "vw";
    c.style.animationDuration = (2 + Math.random() * 2.5) + "s";
    c.style.fontSize = (14 + Math.random() * 22) + "px";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5000);
  }

  // کانفتی خوش‌آمدگویی هنگام باز شدن صفحه
  window.addEventListener("load", () => {
    for (let i = 0; i < 25; i++) setTimeout(spawnConfetti, i * 90);
  });
</script>
</body>
</html>
