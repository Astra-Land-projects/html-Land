<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DEV/256 — ترمینال روز برنامه‌نویس</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23064e2b'/><text x='32' y='42' font-size='24' text-anchor='middle' fill='%238affa0' font-family='monospace'>&lt;/&gt;</text></svg>"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{ --g:#8affa0; --dim:#527d5c; --bg:#050b07; --err:#ff7b6b; --acc:#eafff0; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:'JetBrains Mono','Vazirmatn',monospace;
  background:#070908; color:var(--g);
  display:flex; flex-direction:column; align-items:center;
  padding:16px 12px 26px; gap:14px;
  background-image:radial-gradient(color-mix(in srgb,var(--g) 5%,transparent) 1px,transparent 1px);
  background-size:26px 26px;
}
#matrixCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.45}
#fxCanvas{position:fixed;inset:0;z-index:50;pointer-events:none}
.topbar{
  width:min(920px,100%); display:flex; justify-content:space-between; align-items:baseline;
  font-size:12px; color:var(--dim); direction:ltr; position:relative; z-index:1; letter-spacing:1px;
}
.topbar .fa{direction:rtl; font-family:'Vazirmatn',monospace}
.topbar b{color:var(--g); font-weight:700}
.monitor{
  width:min(920px,100%); position:relative; z-index:1;
  background:#141a16; border:1px solid #26302a; border-radius:20px; padding:14px 14px 10px;
  box-shadow:0 24px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.04);
}
.m-top{display:flex;justify-content:space-between;align-items:center;padding:2px 6px 10px;font-size:11px;color:#6d7a72;letter-spacing:2px;direction:ltr}
.led{width:9px;height:9px;border-radius:50%;background:var(--g);box-shadow:0 0 8px var(--g);animation:pulse 2.4s infinite;transition:.1s}
.led.hot{opacity:1;box-shadow:0 0 16px var(--g);animation:none}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.screen-wrap{position:relative}
.screen{
  height:min(56vh,520px); overflow-y:auto; background:var(--bg);
  border-radius:10px; border:1px solid #1d2620; padding:16px 16px 8px; cursor:text;
}
.scan{
  position:absolute; inset:0; pointer-events:none; border-radius:10px;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.15) 0 1px,transparent 1px 3px);
  box-shadow:inset 0 0 70px rgba(0,0,0,.55);
}
#term{direction:ltr; text-align:left; font-size:13.5px; line-height:1.7}
.ln{white-space:pre-wrap; word-break:break-word; text-align:left; min-height:1.2em}
.ln b{color:var(--acc); font-weight:700}
.ln .c{color:var(--g); font-weight:700}
.ln .d{color:var(--dim)}
.ln .p{color:var(--dim)}
.ln.err{color:var(--err)}
.inline{display:flex;align-items:center;gap:8px;direction:ltr;font-size:13.5px;padding:6px 0 10px}
.inline .p{color:var(--dim);white-space:nowrap}
#cmd{flex:1;background:transparent;border:0;outline:0;color:var(--g);font:inherit;caret-color:var(--g);min-width:60px}
.bitw{display:flex;flex-direction:column;gap:10px;direction:ltr;text-align:left;margin:10px 0 6px;padding:12px 14px;border:1px solid #1e2a22;border-radius:10px;background:rgba(255,255,255,.02);width:max-content;max-width:100%}
.bits{display:flex;gap:10px;flex-wrap:wrap}
.bit{
  width:30px;height:30px;border-radius:50%;border:1px solid var(--dim);
  display:grid;place-items:center;font-size:12px;color:var(--dim);cursor:pointer;
  transition:transform .12s,background .15s,color .15s;user-select:none;
}
.bit:hover{transform:translateY(-2px)}
.bit.on{background:var(--g);color:var(--bg);border-color:var(--g);font-weight:700;box-shadow:0 0 12px color-mix(in srgb,var(--g) 45%,transparent)}
.bitlbl{font-size:12px;color:var(--dim)}
.bitlbl b{color:var(--acc)}
.hint{width:min(920px,100%);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#57615a;font-size:11.5px;position:relative;z-index:1}
kbd{border:1px solid #2a332d;border-radius:5px;padding:1px 7px;color:#93a096;background:#0d1210;font-family:inherit;font-size:10.5px;direction:ltr;display:inline-block}
@media(max-width:600px){ #term,.inline{font-size:12px} .bit{width:25px;height:25px} }
</style>
</head>
<body>
<canvas id="matrixCanvas"></canvas>

<header class="topbar">
  <span><b>DEV/256</b> · phosphor terminal</span>
  <span class="fa" id="dateFa"></span>
</header>

<div class="monitor">
  <div class="m-top">
    <span>DEV-256 &nbsp;·&nbsp; DAY OF THE PROGRAMMER</span>
    <span class="led" id="powerLed"></span>
  </div>
  <div class="screen-wrap">
    <div class="screen" id="screen">
      <div id="term"></div>
      <div class="inline">
        <span class="p">dev@256:~$</span>
        <input id="cmd" autocomplete="off" spellcheck="false" aria-label="ورودی ترمینال">
      </div>
    </div>
    <div class="scan"></div>
  </div>
</div>

<div class="hint">
  <span>↑↓ تاریخچه · Tab تکمیل فرمان · Enter اجرا</span>
  <span>امتحان کن: <kbd>day</kbd> <kbd>bin 202</kbd> <kbd>calc 2^8*3</kbd> <kbd>matrix</kbd> <kbd>confetti</kbd> <kbd>joke</kbd></span>
</div>

<canvas id="fxCanvas"></canvas>

<script>
const $=s=>document.querySelector(s);
const term=$('#term'), screenEl=$('#screen'), cmd=$('#cmd'), led=$('#powerLed');
const mCanvas=$('#matrixCanvas'), mCtx=mCanvas.getContext('2d');
const fCanvas=$('#fxCanvas'), fCtx=fCanvas.getContext('2d');

/* ---------- ابزار ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fa=n=>Number(n).toLocaleString('fa-IR');
let ledT;
function ledPing(){led.classList.add('hot');clearTimeout(ledT);ledT=setTimeout(()=>led.classList.remove('hot'),130)}
function scrollBottom(){screenEl.scrollTop=screenEl.scrollHeight}
function print(html='',cls=''){
  const d=document.createElement('div'); d.className='ln '+cls; d.dir='auto';
  d.innerHTML=html||'&nbsp;'; term.appendChild(d); scrollBottom(); return d;
}

/* ---------- تم ---------- */
const THEMES={
  green:{g:'#8affa0',dim:'#527d5c',bg:'#050b07',err:'#ff7b6b',acc:'#eafff0'},
  amber:{g:'#ffc46b',dim:'#8a6f45',bg:'#0c0904',err:'#ff8a7a',acc:'#fff3dc'},
  cyan :{g:'#7fe8ff',dim:'#4d7f8c',bg:'#030a0d',err:'#ff8a9a',acc:'#eafaff'},
  paper:{g:'#e9e4d2',dim:'#8d8878',bg:'#0e0d0a',err:'#ff9b8a',acc:'#ffffff'},
};
let themeName=localStorage.getItem('dev256-theme')||'green';
function applyTheme(n){
  if(!THEMES[n])return false; themeName=n; const t=THEMES[n];
  for(const[k,v]of Object.entries(t))document.documentElement.style.setProperty('--'+k,v);
  localStorage.setItem('dev256-theme',n); return true;
}
applyTheme(themeName);

/* ---------- تاریخ ---------- */
function dayOfYear(d=new Date()){return Math.floor((d-new Date(d.getFullYear(),0,0))/864e5)}
function isLeap(y){return new Date(y,1,29).getDate()===29}
function devDayInfo(){
  const now=new Date(),y=now.getFullYear(),doy=dayOfYear(now);
  if(doy===256)return{today:true,text:'امروز، روزِ ۲۵۶امِ ساله — روزِ برنامه‌نویسه. مبارک!'};
  if(doy<256)return{today:false,text:`امروز روزِ ${fa(doy)}ِ ساله؛ ${fa(256-doy)} روز تا روز برنامه‌نویس مونده.`};
  const nlen=isLeap(y+1)?366:365;
  return{today:false,text:`روزِ برنامه‌نویسِ امسال ${fa(doy-256)} روز پیش بود؛ ${fa(nlen-doy+256)} روز تا نسخهٔ بعدی مونده.`};
}

/* ---------- ویجت بیت‌ها (کلیک‌پذیر) ---------- */
function bitWidget(bits,value,reveal=false){
  const w=document.createElement('div'); w.className='bitw';
  const row=document.createElement('div'); row.className='bits';
  const lab=document.createElement('div'); lab.className='bitlbl';
  const el=[];
  for(let i=bits-1;i>=0;i--){const b=document.createElement('span');b.className='bit';b.textContent='0';row.appendChild(b);el[i]=b}
  w.appendChild(row); w.appendChild(lab);
  const binStr=()=>Array.from({length:bits},(_,k)=>el[bits-1-k].classList.contains('on')?'1':'0').join('');
  function paint(){
    let v=0; el.forEach((b,i)=>{if(b.classList.contains('on'))v+=2**i});
    lab.innerHTML=`bin <b>${binStr()}</b> = dec <b>${v}</b> = hex <b>0x${v.toString(16).toUpperCase().padStart(Math.ceil(bits/4),'0')}</b>`;
  }
  el.forEach(b=>b.addEventListener('click',()=>{b.classList.toggle('on');paint();ledPing()}));
  if(reveal){ // حرکت لامپِ روشن از بیت ۰ تا بیت ۸ یعنی ۱ تا ۲۵۶
    const seq=[1,2,4,8,16,32,64,128,256];
    seq.forEach((x,k)=>setTimeout(()=>{
      el.forEach((b,i)=>b.classList.toggle('on',i===Math.log2(x)));
      paint(); ledPing();
    },350+k*240));
  }else{
    el.forEach((b,i)=>{if(value>>i&1)b.classList.add('on')}); paint();
  }
  return w;
}

/* ---------- باران کد ---------- */
let mOn=false,mDrops=[],mFs=15;
const MCHARS='アカサタナハマヤラワ0123456789{}<>=+*/;#$'.split('');
function resizeM(){mCanvas.width=innerWidth;mCanvas.height=innerHeight;mDrops=Array.from({length:Math.ceil(innerWidth/mFs)},()=>Math.random()*-60)}
function loopM(){
  if(!mOn)return;
  const g=getComputedStyle(document.documentElement).getPropertyValue('--g').trim();
  mCtx.fillStyle='rgba(4,9,6,0.09)'; mCtx.fillRect(0,0,mCanvas.width,mCanvas.height);
  mCtx.font=mFs+'px "JetBrains Mono",monospace';
  mDrops.forEach((y,i)=>{
    mCtx.fillStyle=g;
    mCtx.fillText(MCHARS[Math.floor(Math.random()*MCHARS.length)],i*mFs,y*mFs);
    if(y*mFs>mCanvas.height&&Math.random()>0.975)mDrops[i]=0;
    mDrops[i]++;
  });
  requestAnimationFrame(loopM);
}

/* ---------- کانفتی (ذره‌های رنگی + کاراکترهای کد) ---------- */
let P=[],rafF=null;
function resizeF(){fCanvas.width=innerWidth;fCanvas.height=innerHeight}
function confetti(n=160){
  const W=fCanvas.width,H=fCanvas.height;
  const acc=getComputedStyle(document.documentElement).getPropertyValue('--acc').trim();
  const cols=['#ff6b6b','#ffd166','#6be7a8','#6bc5ff','#ff9de2',acc];
  for(let k=0;k<3;k++){
    const x=W*(0.28+0.22*k), y=H*0.32;
    for(let i=0;i<n/3;i++){
      const a=Math.random()*Math.PI*2, sp=4+Math.random()*9, ch=Math.random()<0.22;
      P.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-4.2,rot:Math.random()*6.28,vr:(Math.random()-.5)*.35,
        w:4+Math.random()*7,h:2+Math.random()*5,c:pick(cols),life:90+Math.random()*60,
        ch:ch?pick(['{','}','<','>',';','=','*']):null});
    }
  }
  if(!rafF)rafF=requestAnimationFrame(loopF);
}
function loopF(){
  fCtx.clearRect(0,0,fCanvas.width,fCanvas.height);
  P=P.filter(p=>p.life>0&&p.y<fCanvas.height+30);
  for(const p of P){
    p.vy+=.18;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life--;
    fCtx.save();fCtx.translate(p.x,p.y);fCtx.rotate(p.rot);
    fCtx.globalAlpha=Math.min(1,p.life/40);fCtx.fillStyle=p.c;
    if(p.ch){fCtx.font='13px "JetBrains Mono",monospace';fCtx.fillText(p.ch,-5,5)}
    else fCtx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    fCtx.restore();
  }
  if(P.length)rafF=requestAnimationFrame(loopF);
  else{rafF=null;fCtx.clearRect(0,0,fCanvas.width,fCanvas.height)}
}

/* ---------- محتوا ---------- */
const JOKES=[
'۱۰ نوع آدم وجود داره: اونایی که باینری بلدن و اونایی که بلد نیستن.',
'چرا برنامه‌نویس‌ها هالووین و کریسمس رو قاطی می‌کنن؟ چون OCT 31 == DEC 25.',
'۹۹ باگ کوچیک تو کد... یکی رو فیکس کن، ۱۱۷ باگ کوچیک تو کد.',
'کامنتِ «این کد رو دست نزن» یعنی یه روزی باید فهمید اصلاً چی‌کار می‌کنه.',
'بهترین دیباگر دنیا؟ یه خواب شبانه. فردا صبح باگ خودش لو می‌ره.',
'برنامه‌نویسی یعنی ۱۰٪ کدنویسی و ۹۰٪ نگاه‌کردن به صفحه و گفتن «چرا؟»',
];
const FORTUNES=[
'باگ امروز، پله‌ی فرداست. ادامه بده.',
'قبل از بهینه‌سازی، اول بخون؛ بعد فکر کن؛ آخر دست بزن.',
'کدی که توضیحش بدی یادت می‌مونه؛ کدی که «فردا می‌نویسم»، نه.',
'یک refactoring کوچیک امروز، نسخهٔ ۲.۰ فردا.',
'امروز یه تابع بنویس که فقط یه کار بکنه. فقط یکی.',
];
const WHO=[
'یک انسان با ۲۵۶ گیگ حافظهٔ موقت که مدام refresh می‌شه.',
'admin این ترمینال. بقیه فقط مهمانن.',
'کسی که باگ‌ها رو «قابلیتِ پیش‌بینی‌نشده» صدا می‌زنه.',
'کاربری که قهوه‌ش هنوز داغه و هنوز دلسرد نشده.',
];
function ascii256(){
  const F={
    '2':['  ___  ',' |__ \\ ','   / / ','  / /_ ',' |____|'],
    '5':[' ____  ','| ___| ','| __ \\ ','| |_/ /',' \\____/'],
    '6':['  ____ ',' / ___|','| |    ','| |___ ',' \\____|']
  };
  const rows=['','','','',''];
  '256'.split('').forEach(ch=>F[ch].forEach((r,i)=>rows[i]+=r+'   '));
  return rows.join('\n');
}
const COFFEE=['      ( (','       ) )','    ........','    |      |]','    \\      /','     \'----\''].join('\n');

/* ---------- فرمان‌ها ---------- */
const CMDS={
  help:{d:'همین راهنما که الان می‌بینی',fn(){
    print('<b>فرمان‌های موجود:</b>');
    Object.entries(CMDS).forEach(([k,v])=>print(`  <span class="c">${k.padEnd(10)}</span><span class="d">${v.d}</span>`));
  }},
  day:{d:'گزارش روز ۲۵۶ — قلب‌نامهٔ این ترمینال',fn(){
    const info=devDayInfo();
    print('<b>DAY 256 = 2^8</b>');
    print(info.text);
    print('<span class="d">باینریِ ۲۵۶ — لامپ روشن از بیت ۰ تا ۸ حرکت می‌کنه (روی بیت‌ها کلیک هم می‌تونی بکنی):</span>');
    term.appendChild(bitWidget(9,256,true)); scrollBottom();
    if(info.today)setTimeout(()=>confetti(220),1100);
  }},
  bin:{d:'ماشین‌حساب باینری — مثال: bin 202',fn(a){
    const n=parseInt(a[0],10);
    if(isNaN(n)||n<0||n>255){print('یک عدد بین 0 تا 255 بده. مثال: <span class="c">bin 202</span>','err');return}
    print(`<span class="d">عدد ${n} — روی بیت‌ها بزن و خودت بساز:</span>`);
    term.appendChild(bitWidget(8,n,false)); scrollBottom();
  }},
  hex:{d:'تبدیل به هگز و باینری — مثال: hex 4096',fn(a){
    const n=parseInt(a[0],10);
    if(isNaN(n)){print('مثال: <span class="c">hex 4096</span>','err');return}
    print(`${n} = <b>0x${n.toString(16).toUpperCase()}</b> = <b>0b${n.toString(2)}</b>`);
  }},
  calc:{d:'ماشین‌حساب — مثال: calc (2^8)*3+14',fn(a){
    const ex=a.join(' ');
    if(!ex){print('مثال: <span class="c">calc (2^8)*3+14</span>','err');return}
    if(!/^[-+*/%().\d\s^]+$/.test(ex)){print('فقط عدد و + - * / % ( ) ^ قبوله.','err');return}
    try{
      const r=Function('"use strict";return ('+ex.replaceAll('^','**')+')')();
      print(`${ex} = <b>${+r.toFixed(10)}</b>`);
    }catch{print('عبارت درست نیست.','err')}
  }},
  date:{d:'تاریخ امروز و فاصله تا روز برنامه‌نویس',fn(){
    const now=new Date();
    print('شمسی: <b>'+new Intl.DateTimeFormat('fa-IR',{dateStyle:'full'}).format(now)+'</b>');
    print('میلادی: <span class="d">'+new Intl.DateTimeFormat('en-GB',{dateStyle:'full'}).format(now)+'</span>');
    print(`روزِ ${fa(dayOfYear(now))}ِ سال — ${esc(devDayInfo().text)}`);
  }},
  matrix:{d:'باران کد پس‌زمینه — روشن/خاموش',fn(){
    mOn=!mOn;
    if(mOn){resizeM();loopM();print('باران کد روشن شد. دوباره <span class="c">matrix</span> بنویس تا خاموش شه.')}
    else{mCtx.clearRect(0,0,mCanvas.width,mCanvas.height);print('باران کد خاموش شد.')}
  }},
  confetti:{d:'جشن — مثال: confetti 300',fn(a){
    const n=Math.min(600,Math.max(40,parseInt(a[0])||160));
    confetti(n); print(`حدود ${fa(n)} ذره در راهه. جشن بگیر!`);
  }},
  joke:{d:'یک جوک برنامه‌نویسی',fn(){print(pick(JOKES))}},
  fortune:{d:'فالِ دولوپری',fn(){print('<span class="d">«'+pick(FORTUNES)+'»</span>')}},
  ascii:{d:'پوستر متنی ۲۵۶',fn(){print(esc(ascii256()));print('<span class="d">HAPPY DEV DAY — 2^8 = 256</span>','d')}},
  theme:{d:'تم ترمینال: green | amber | cyan | paper',fn(a){
    if(!a[0]){print('تم‌ها: <span class="c">green amber cyan paper</span> — مثال: theme amber');return}
    if(applyTheme(a[0]))print(`تم <b>${a[0]}</b> فعال شد.`);
    else print('تم ناشناخته‌ست. تم‌ها: green | amber | cyan | paper','err');
  }},
  whoami:{d:'تو کی هستی؟',fn(){print(pick(WHO))}},
  coffee:{d:'یک فنجان انگیزه',fn(){print(esc(COFFEE));print('<span class="d">قهوه آماده‌ست. کد بعدی رو بنویس.</span>','d')}},
  celebrate:{d:'جشن کامل: کانفتی + باران کد',fn(){
    if(!mOn){mOn=true;resizeM();loopM()}
    confetti(260);
    print('<b>۲۵۶ مبارک!</b> — کد بزن، جشن بگیر، مدرسه رو هم درست بخون.');
    setTimeout(()=>confetti(180),700);
  }},
  sudo:{d:'امتحان کن ببینیم',fn(){
    print('dev is not in the sudoers file.','err');
    print('<span class="d">این رخداد به معلم گزارش خواهد شد :)</span>','d');
  }},
  clear:{d:'پاک‌سازی صفحه',fn(){term.innerHTML=''}},
};

/* ---------- پیشنهاد فرمان اشتباه (فاصلهٔ لِوِنشتاین) ---------- */
function lev(a,b){
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},(_,i)=>{const r=new Array(n+1).fill(0);r[0]=i;return r});
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return dp[m][n];
}
function suggest(c){
  let best=null,bd=3;
  for(const k of Object.keys(CMDS)){const d=lev(c,k);if(d<bd){bd=d;best=k}}
  return bd<=2?best:null;
}
function run(c,args){
  const def=CMDS[c];
  if(!def){
    print(`فرمان «${esc(c)}» شناخته نشد.`,'err');
    const s=suggest(c);
    if(s)print(`نزدیک‌ترین فرمان: <span class="c">${s}</span> — شاید منظورت این بود؟`,'d');
    print(`راهنمای کامل: <span class="c">help</span>`,'d');
    return;
  }
  def.fn(args);
}

/* ---------- ورودی، تاریخچه، تکمیل ---------- */
const hist=[]; let hi=-1, draft='';
function histNav(d){
  if(!hist.length)return;
  if(d>0){
    if(hi===-1){draft=cmd.value;hi=hist.length-1}
    else if(hi>0)hi--;
    cmd.value=hist[hi];
  }else{
    if(hi===-1)return;
    hi++;
    if(hi>=hist.length){hi=-1;cmd.value=draft}else cmd.value=hist[hi];
  }
}
function complete(){
  const v=cmd.value.trim().toLowerCase(); if(!v)return;
  const m=Object.keys(CMDS).filter(k=>k.startsWith(v));
  if(m.length===1)cmd.value=m[0]+' ';
  else if(m.length>1)print(`<span class="p">dev@256:~$</span> ${esc(v)}  <span class="d">→  ${m.join('  ')}</span>`);
}
function exec(raw){
  const line=raw.trim();
  print(`<span class="p">dev@256:~$</span> ${esc(raw)}`);
  if(!line)return;
  if(hist[hist.length-1]!==line)hist.push(line);
  hi=-1;
  const [c,...args]=line.split(/\s+/);
  run(c.toLowerCase(),args);
}
cmd.addEventListener('keydown',e=>{
  if(e.key==='Enter'){const v=cmd.value;cmd.value='';exec(v)}
  else if(e.key==='ArrowUp'){e.preventDefault();histNav(1)}
  else if(e.key==='ArrowDown'){e.preventDefault();histNav(-1)}
  else if(e.key==='Tab'){e.preventDefault();complete()}
  else ledPing();
});
screenEl.addEventListener('click',()=>{if(!getSelection().toString())cmd.focus()});
window.addEventListener('resize',()=>{resizeM();resizeF()});

/* ---------- بوت ---------- */

    ['',90],
    ['<b>روز برنامه‌نویس و بازگشت به مدرسه، مبارک!</b>',280],
    ['<span class="d">برای شروع بنویس:</span> <span class="c">help</span> <span class="d">— با ↑ تاریخچه و با Tab تکمیل فرمان</span>',0],
  ];
  for(const[h,t]of B){print(h);ledPing();await sleep(t)}
  cmd.focus();
})();
