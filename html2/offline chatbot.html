<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>AG9 Offline Chatbot</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fbf5ea;--card:#fff;--ink:#2a1d10;--mut:#7a6a56;--acc:#d97706;--line:#e6d8c2;--me:#fde6bd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120d09;--card:#1c1510;--ink:#f6ead8;--mut:#b39d82;--acc:#ffb347;--line:#3a2d20;--me:#4a3217}}
:root[data-theme="dark"]{--bg:#120d09;--card:#1c1510;--ink:#f6ead8;--mut:#b39d82;--acc:#ffb347;--line:#3a2d20;--me:#4a3217}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{height:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;padding:10px 12px}
header{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px}
h1{font-size:18px;margin:0}h1 span{color:var(--acc)}
button,input{font:inherit;color:var(--ink)}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 0}
.m{max-width:88%;padding:9px 12px;border-radius:16px;white-space:pre-wrap;word-break:break-word;border:1px solid var(--line);background:var(--card)}
.m.u{align-self:flex-end;background:var(--me)}
.m pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;overflow-x:auto;margin:6px 0;font:13px/1.4 ui-monospace,Menlo,monospace;white-space:pre}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer}
form{display:flex;gap:8px;padding-top:8px}
#q{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
#go{background:var(--acc);border:0;border-radius:14px;padding:0 18px;font-weight:700;color:#1a0f05;cursor:pointer}
.dots{color:var(--mut)}
</style></head><body>
<div id="app">
<header><h1>AG9 <span>Offline Chatbot</span></h1><button id="clr" class="pill">Clear</button></header>
<div id="log"></div>
<form id="f"><input id="q" autocomplete="off" placeholder="Ask about electronics, Python, AI, robotics… or type 12*(3+4)^2"><button id="go">Send</button></form>
</div>
<script>
(function(){
'use strict';
var KB=[
{t:'Ohm’s law',k:'ohm law voltage current resistance v=ir watt power formula',a:'Ohm’s law: V = I × R.\nPower: P = V × I = I²R = V²/R.\nExample: 5 V across 220 Ω gives I = 5/220 ≈ 22.7 mA.'},
{t:'Resistors',k:'resistor color code band ohm series parallel pull-up pull-down',a:'Series: R = R1 + R2 + …\nParallel: 1/R = 1/R1 + 1/R2 + …\nColor code digits: black 0, brown 1, red 2, orange 3, yellow 4, green 5, blue 6, violet 7, grey 8, white 9. The last band before tolerance is the multiplier.\nA pull-up resistor (about 10 kΩ) keeps an input HIGH when a switch is open.'},
{t:'LED resistor',k:'led resistor current limiting forward voltage calculate',a:'R = (Vsupply − Vforward) / I.\nA red LED at 5 V and 15 mA: (5 − 2) / 0.015 = 200 Ω, so use 220 Ω.'},
{t:'Capacitors',k:'capacitor farad rc time constant filter decoupling charge',a:'A capacitor stores charge: Q = C × V.\nRC time constant τ = R × C; it reaches about 63% after 1τ and about 99% after 5τ.\nPut a 100 nF decoupling capacitor close to every IC power pin.'},
{t:'Voltage divider',k:'voltage divider vout r1 r2 sensor adc',a:'Vout = Vin × R2 / (R1 + R2).\nIt is how you read a resistive sensor (LDR, thermistor) with an ADC pin.'},
{t:'Transistors and MOSFETs',k:'transistor mosfet bjt switch gate base driver motor load',a:'Use a logic-level MOSFET (e.g. IRLZ44N) as a low-side switch to drive motors, relays or LED strips.\nAdd a 100 Ω gate resistor, a 10 kΩ pull-down on the gate, and a flyback diode across inductive loads.'},
{t:'Arduino',k:'arduino uno nano atmega328 sketch setup loop digitalwrite analogread',a:'An Arduino sketch has setup() (runs once) and loop() (repeats).\n```\nvoid setup(){ pinMode(13, OUTPUT); }\nvoid loop(){\n  digitalWrite(13, HIGH); delay(500);\n  digitalWrite(13, LOW);  delay(500);\n}\n```'},
{t:'ESP32',k:'esp32 esp8266 wifi bluetooth microcontroller iot',a:'The ESP32 is a dual-core 240 MHz microcontroller with Wi-Fi and Bluetooth, 12-bit ADC and many PWM pins. It runs at 3.3 V logic, so never feed 5 V into its pins. Program it with Arduino IDE, PlatformIO or MicroPython.'},
{t:'PWM',k:'pwm pulse width modulation duty cycle analogwrite dimming speed',a:'PWM switches a pin on and off quickly. Average voltage = Vcc × duty cycle. Use it to dim LEDs and control motor speed. On Arduino: analogWrite(pin, 0–255).'},
{t:'PID control',k:'pid controller proportional integral derivative tuning kp ki kd control loop',a:'u = Kp·e + Ki·∫e dt + Kd·de/dt.\nP reacts to the present error, I removes steady-state error, D damps oscillation.\nTuning: set Ki = Kd = 0, raise Kp until it oscillates, then back off; add Kd to calm it; add a little Ki last.\n```\nerr = target - measured;\nintegral += err * dt;\nderiv = (err - prev) / dt;\nout = kp*err + ki*integral + kd*deriv;\nprev = err;\n```'},
{t:'Servo motors',k:'servo motor sg90 angle pulse mg996',a:'A hobby servo expects a 50 Hz signal with a 1–2 ms pulse: about 1 ms is 0°, 1.5 ms is 90°, 2 ms is 180°. Power it from a separate 5 V supply and share the ground with the controller.'},
{t:'DC motors and H-bridge',k:'dc motor h-bridge l298n l293d tb6612 direction driver stepper',a:'An H-bridge (L298N, TB6612) lets you spin a DC motor both ways: two direction pins plus one PWM pin for speed. Stepper motors need a stepper driver (A4988, DRV8825) with STEP and DIR pins.'},
{t:'Sensors',k:'sensor ultrasonic hc-sr04 ir ldr dht11 mpu6050 imu temperature distance',a:'Common sensors: HC-SR04 (ultrasonic distance, d = time × 0.0343 / 2 cm), IR reflectance (line following), DHT11/DHT22 (temperature and humidity), MPU6050 (accelerometer plus gyro over I2C), LDR (light, use a divider).'},
{t:'I2C, SPI, UART',k:'i2c spi uart serial protocol sda scl communication bus',a:'UART: 2 wires (TX, RX), asynchronous, matching baud rate.\nI2C: 2 wires (SDA, SCL), many devices by address, needs pull-ups.\nSPI: 4 wires (MOSI, MISO, SCK, CS), fastest, one CS per device.'},
{t:'Line follower robot',k:'line follower robot ir sensors pid differential drive',a:'Read an IR sensor array, compute a weighted position error (for 5 sensors: −2 … +2), feed it to a PID controller, then speed up one wheel and slow the other: left = base + u, right = base − u. Try the AG9 Robot Simulator to tune it visually.'},
{t:'Robot kinematics',k:'kinematics differential drive odometry forward inverse arm joint',a:'Differential drive: v = (vR + vL)/2, ω = (vR − vL)/L.\nPose update: x += v·cosθ·dt, y += v·sinθ·dt, θ += ω·dt.\nFor arms, forward kinematics maps joint angles to the end-effector position; inverse kinematics solves the opposite.'},
{t:'Python basics',k:'python variable list dictionary loop function def class tutorial syntax',a:'```\nnums = [1, 2, 3]\nsquares = [n*n for n in nums]\nuser = {"name": "Arya", "age": 20}\ndef add(a, b):\n    return a + b\nfor i, n in enumerate(nums):\n    print(i, n)\n```\nLists are ordered and mutable, dicts map keys to values, and functions use def.'},
{t:'NumPy and pandas',k:'numpy pandas array dataframe matrix data analysis',a:'```\nimport numpy as np, pandas as pd\na = np.array([[1,2],[3,4]])\nprint(a @ a, a.T)\ndf = pd.read_csv("data.csv")\nprint(df.describe())\n```\nNumPy does fast array math; pandas handles tables.'},
{t:'Machine learning',k:'machine learning ml supervised unsupervised training model classification regression',a:'Supervised learning learns from labeled data (classification, regression). Unsupervised learning finds structure without labels (clustering). Workflow: collect data, split train/test, fit, evaluate, iterate. Start with scikit-learn: LogisticRegression, RandomForest, KNN.'},
{t:'Overfitting',k:'overfitting underfitting bias variance regularization validation generalization',a:'Overfitting means high training accuracy but poor test accuracy. Fixes: more data, simpler model, regularization (L1/L2, dropout), early stopping, cross-validation.'},
{t:'Gradient descent',k:'gradient descent learning rate loss optimizer backpropagation adam',a:'Gradient descent updates weights w ← w − η·∇L. A learning rate that is too big diverges; too small is slow. Backpropagation computes the gradients layer by layer. Adam is a popular adaptive optimizer.'},
{t:'Neural networks',k:'neural network deep learning layer neuron activation relu cnn tensorflow pytorch',a:'A neuron computes y = f(w·x + b). Layers of neurons with non-linear activations (ReLU, sigmoid, softmax) learn complex functions. CNNs suit images, RNNs/Transformers suit sequences. Frameworks: PyTorch and TensorFlow.'},
{t:'TinyML',k:'tinyml tflite micro edge embedded inference quantization microcontroller ai',a:'TinyML runs small neural nets on microcontrollers. Train in TensorFlow, quantize to int8, convert to TensorFlow Lite for Microcontrollers, and run on an ESP32 or Arduino Nano 33 BLE. Typical uses: gesture, keyword spotting, anomaly detection.'},
{t:'Git',k:'git commit branch merge push pull github version control',a:'```\ngit init\ngit add .\ngit commit -m "message"\ngit branch feature && git switch feature\ngit push origin main\n```\nCommit small and often; use branches for features.'},
{t:'HTML, CSS, JavaScript',k:'html css javascript js web frontend flexbox dom website',a:'HTML is structure, CSS is style, JavaScript is behavior. Centering with flexbox:\n```\n.box{display:flex;justify-content:center;align-items:center}\n```\nUse document.querySelector to select elements and addEventListener for events.'},
{t:'Django',k:'django python web backend model view template orm admin',a:'Django follows MTV: Models (database via the ORM), Templates (HTML), Views (logic). Start: django-admin startproject site, python manage.py startapp app, makemigrations, migrate, runserver. The admin panel comes free.'},
{t:'Number systems',k:'binary hex hexadecimal octal decimal conversion bit byte base',a:'Binary uses base 2, octal base 8, hex base 16. Example: 255 = 0b11111111 = 0xFF. In Python: bin(255), hex(255), int("ff", 16). One hex digit equals 4 bits.'},
{t:'Big-O complexity',k:'big o complexity algorithm sorting search binary time performance',a:'Big-O describes growth: O(1) constant, O(log n) binary search, O(n) scan, O(n log n) good sorts, O(n²) nested loops. Binary search needs sorted data and halves the range each step.'},
{t:'Calculus basics',k:'derivative integral limit calculus differentiation chain rule',a:'d/dx xⁿ = n·xⁿ⁻¹, d/dx sin x = cos x, d/dx eˣ = eˣ. Chain rule: (f(g))′ = f′(g)·g′. ∫xⁿ dx = xⁿ⁺¹/(n+1) + C. For heavy math use the AG9 Engineering Calculator.'},
{t:'Battery and power',k:'battery lipo li-ion mah capacity voltage regulator buck boost power supply',a:'Runtime ≈ capacity (mAh) / load current (mA), reduced by about 20% for safety. A LiPo cell is 3.7 V nominal (4.2 V full, never below 3.0 V). Use a buck converter for efficient step-down; linear regulators waste the difference as heat.'}];
var STOP=new Set('a an the is are what how do does i to of in on for and or with my me can you it this that about tell explain give use using vs between be at as please'.split(' '));
function stem(w){return w.length>3&&w.endsWith('s')&&!w.endsWith('ss')?w.slice(0,-1):w}
function tok(s){return (s.toLowerCase().match(/[a-z0-9+#.=\-]+/g)||[]).map(function(w){return w.replace(/^[.\-]+|[.\-]+$/g,'')}).filter(function(w){return w&&!STOP.has(w)}).map(stem)}
var docs=KB.map(function(e){var tt=tok(e.t),kt=tok(e.k);return {e:e,t:new Set(tt),all:new Set(tt.concat(kt))}});
var df={};docs.forEach(function(d){d.all.forEach(function(w){df[w]=(df[w]||0)+1})});
function idf(w){return Math.log(1+docs.length/df[w])}
function rank(q){
  var qs=Array.from(new Set(tok(q)));
  return docs.map(function(d){var s=0;qs.forEach(function(w){if(d.all.has(w))s+=idf(w)*(d.t.has(w)?2:1)});return {e:d.e,s:s}}).sort(function(a,b){return b.s-a.s})}
function calc(src){
  var s=src.toLowerCase().replace(/what('| i)?s|calculate|compute|evaluate|=|\?/g,'').trim();
  if(!/\d/.test(s))return null;
  var rest=s.replace(/\b(sqrt|sin|cos|tan|log|ln|abs|pi|e)\b/g,'');
  if(!/^[\d\s+\-*\/^().%,x×÷]*$/.test(rest))return null;
  if(!/[+\-*\/^%x×÷]|sqrt|sin|cos|tan|log|ln|abs/.test(s))return null;
  s=s.replace(/×|x(?=\s*\d)/g,'*').replace(/÷/g,'/');
  var t=s.match(/\d+\.?\d*(?:e[+-]?\d+)?|[a-z]+|[-+*\/^%(),]/g),p=0;
  if(!t)return null;
  function pk(){return t[p]}
  function ex(){var v=tm();while(pk()==='+'||pk()==='-'){var o=t[p++],r=tm();v=o==='+'?v+r:v-r}return v}
  function tm(){var v=un();while(pk()==='*'||pk()==='/'||pk()==='%'){var o=t[p++],r=un();v=o==='*'?v*r:o==='/'?v/r:v%r}return v}
  function un(){if(pk()==='-'){p++;return -un()}if(pk()==='+'){p++;return un()}return pw()}
  function pw(){var b=at();if(pk()==='^'){p++;return Math.pow(b,un())}return b}
  function at(){
    var x=t[p++];if(x===undefined)throw 0;
    if(/^\d/.test(x))return parseFloat(x);
    if(x==='pi')return Math.PI;if(x==='e')return Math.E;
    if(x==='('){var v=ex();if(t[p++]!==')')throw 0;return v}
    var F={sqrt:Math.sqrt,sin:Math.sin,cos:Math.cos,tan:Math.tan,log:Math.log10,ln:Math.log,abs:Math.abs};
    if(F[x]&&t[p++]==='('){var a=ex();if(t[p++]!==')')throw 0;return F[x](a)}
    throw 0}
  try{var v=ex();if(p!==t.length||!isFinite(v))return null;return v}catch(e){return null}}
var SUG=['PID control','Ohm’s law','Arduino','Gradient descent','Python basics'];
function reply(m){
  var l=m.toLowerCase().trim();
  if(/^(hi|hello|hey|salam|yo|good (morning|evening))\b/.test(l))return {a:'Hello! I’m the AG9 offline assistant. I know electronics, robotics, programming and ML basics, and I can do quick math. What would you like to learn?',c:SUG};
  if(/^(thanks|thank you|thx)/.test(l))return {a:'You’re welcome! Ask me anything else.'};
  if(/(who are you|your name)/.test(l))return {a:'I’m a small rule-based assistant that runs fully offline in your browser. I match your question against a built-in knowledge base; I’m not a large language model.'};
  if(/^(help|topics|\/help|menu)$/.test(l))return {a:'I know these topics. Tap one or type your own question, or an expression like 2^10 + sqrt(144).',c:KB.map(function(e){return e.t})};
  if(/^(what('| i)?s )?(the )?(current )?time( now)?\??$/.test(l))return {a:new Date().toLocaleTimeString()};
  if(/^(what('| i)?s )?(the |today('| i)?s )?(date|day)( today)?\??$/.test(l))return {a:new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'})};
  var v=calc(l);if(v!==null)return {a:'= '+(+v.toPrecision(12))};
  var r=rank(m);
  if(r[0].s>=1.6){var ex=r.slice(1,4).filter(function(x){return x.s>=1.2}).map(function(x){return x.e.t});return {a:r[0].e.a,c:ex}}
  return {a:'I’m not sure about that one. Try one of these topics, or type “help” to see them all.',c:SUG}}
//--DOM--
var log=document.getElementById('log'),q=document.getElementById('q');
function add(text,me,chips){
  var d=document.createElement('div');d.className='m'+(me?' u':'');
  text.split(/```\n?([\s\S]*?)```/).forEach(function(seg,i){
    if(i%2){var pr=document.createElement('pre');pr.textContent=seg.replace(/\n$/,'');d.appendChild(pr)}
    else if(seg){d.appendChild(document.createTextNode(i?seg.replace(/^\n/,''):seg.replace(/\n$/,'')))}});
  if(chips&&chips.length){var c=document.createElement('div');c.className='chips';
    chips.forEach(function(s){var b=document.createElement('button');b.type='button';b.textContent=s;b.onclick=function(){send(s)};c.appendChild(b)});d.appendChild(c)}
  log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function send(text){
  text=text.trim();if(!text)return;
  add(text,true);q.value='';
  var dots=add('…',false);dots.classList.add('dots');
  setTimeout(function(){dots.remove();var r=reply(text);add(r.a,false,r.c)},350)}
document.getElementById('f').onsubmit=function(e){e.preventDefault();send(q.value)};
document.getElementById('clr').onclick=function(){log.innerHTML='';add('Chat cleared. Ask me something!',false,SUG)};
add('Hi, I’m the AG9 offline assistant. Ask about electronics, Arduino/ESP32, PID, Python, machine learning, Git, web basics — or type a math expression.',false,SUG);
})();
</script></body></html>
