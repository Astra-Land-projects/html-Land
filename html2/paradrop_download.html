<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Download Button</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 42%,#062327,#02090c 38%,#010407);color:#edfafa;font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}.app{width:min(720px,92vw);text-align:center}.brand{font:10px/1 monospace;letter-spacing:4px;color:#8a999d;margin-bottom:30px}.title{font:clamp(42px,8vw,70px) Georgia,serif;margin:0 0 70px}.download{border:0;background:none;color:#21ffe0;cursor:pointer;position:relative;width:160px;height:140px}.orb{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:55px;height:55px;clip-path:polygon(50% 0,100% 38%,80% 100%,20% 100%,0 38%);background:linear-gradient(150deg,#7ffff1,#00bda9);filter:drop-shadow(0 0 15px #21ffe0);transition:.3s}.arrow{position:absolute;left:50%;top:56px;transform:translateX(-50%);font-size:48px;font-weight:800;text-shadow:0 0 20px #21ffe0}.download:hover .orb{transform:translateX(-50%) translateY(-6px) rotate(8deg)}.track{width:min(420px,80vw);height:3px;background:#183035;border-radius:10px;margin:34px auto 14px;overflow:hidden}.fill{height:100%;width:0;background:#20ffe0;box-shadow:0 0 14px #20ffe0;transition:width .08s linear}.pct{font:11px monospace;color:#76878a}.cancel{margin-top:34px;color:#777f82;font:10px monospace;cursor:pointer}.file{margin-top:18px;color:#3c4b4e;font:10px monospace}.success{display:none;color:#20ffe0;font-size:13px;letter-spacing:2px;margin-top:18px}.code{position:fixed;bottom:0;left:0;right:0;height:120px;background:#061015;border-top:1px solid #ffffff08;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px}.code div{background:#071319;border-radius:8px;padding:12px;text-align:left;font:9px/1.55 monospace;color:#526467;overflow:hidden}.code b{color:#ff6fae}.code i{color:#b6ff4b;font-style:normal}@media(max-width:600px){.code{height:90px}.code div{font-size:7px}.title{margin-bottom:45px}}
</style></head><body><main class="app"><div class="brand">PARADROP</div><h1 class="title">Download Button</h1><button class="download" id="download"><span class="orb"></span><span class="arrow">⬆</span></button><div class="track"><div class="fill" id="fill"></div></div><div class="pct" id="pct">0%</div><div class="cancel" id="cancel">CANCEL</div><div class="file">paradrop-kit.txt 7 KB</div><div class="success" id="success">✓ DOWNLOAD COMPLETE</div></main><section class="code"><div><b>index.html</b><br><br>&lt;button class="download"&gt;<br>&nbsp;&nbsp;&lt;span class="orb"&gt;&lt;/span&gt;<br>&lt;/button&gt;</div><div><b>style.css</b><br><br><i>.fill</i>{width:var(--progress)};<br>box-shadow:0 0 14px #20ffe0;</div><div><b>app.js</b><br><br>let progress = 0;<br>requestAnimationFrame(tick);<br>finish();</div></section><script>const btn=document.getElementById('download'),fill=document.getElementById('fill'),pct=document.getElementById('pct'),cancel=document.getElementById('cancel'),success=document.getElementById('success');let timer=null,progress=0;function start(){clearInterval(timer);progress=0;success.style.display='none';cancel.textContent='CANCEL';timer=setInterval(()=>{progress+=Math.random()*3+1;if(progress>=100){progress=100;clearInterval(timer);cancel.textContent='';success.style.display='block'}fill.style.width=progress+'%';pct.textContent=Math.floor(progress)+'%'},90)}btn.onclick=start;cancel.onclick=()=>{if(progress<100){clearInterval(timer);progress=0;fill.style.width='0%';pct.textContent='0%';cancel.textContent='CANCEL'}};start();</script></body></html>
