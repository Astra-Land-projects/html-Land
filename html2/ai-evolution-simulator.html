<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Evolution Simulator</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#050910;
    color:#edf5ff;
    font-family:Arial,sans-serif;
    overflow:hidden
}

header{
    height:64px;
    background:#0b1320;
    border-bottom:1px solid #26384f;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px
}

h1{
    margin:0;
    font-size:20px;
    letter-spacing:.5px
}

.controls{
    display:flex;
    gap:7px;
    flex-wrap:wrap
}

button{
    background:#15253a;
    color:white;
    border:1px solid #39536e;
    padding:8px 12px;
    border-radius:7px;
    cursor:pointer
}

button:hover{
    background:#213c5a
}

.main{
    height:calc(100vh - 64px);
    display:grid;
    grid-template-columns:1fr 350px
}

.world{
    position:relative;
    background:#0c171d;
    overflow:hidden
}

canvas{
    width:100%;
    height:100%;
    display:block
}

.panel{
    background:#0a111c;
    border-left:1px solid #26384f;
    padding:15px;
    overflow:auto
}

.stat{
    background:#101b2a;
    border-radius:8px;
    padding:11px;
    margin-bottom:8px
}

.label{
    color:#8094ab;
    font-size:11px;
    text-transform:uppercase
}

.value{
    font-size:21px;
    margin-top:4px
}

.agent{
    background:#101b29;
    padding:10px;
    border-radius:8px;
    margin-bottom:8px;
    border-left:3px solid #4ca6ff
}

.agent b{
    display:block;
    margin-bottom:5px
}

.small{
    color:#9eafc2;
    font-size:11px;
    line-height:1.6
}

.bar{
    height:5px;
    background:#26364b;
    border-radius:4px;
    overflow:hidden;
    margin:3px 0 6px
}

.fill{
    height:100%;
    background:#4ca6ff
}

.log{
    background:#070c13;
    padding:8px;
    height:130px;
    overflow:auto;
    font-size:10px;
    color:#91a4b9
}

.legend{
    color:#91a4b9;
    font-size:11px;
    line-height:1.8
}
</style>
</head>

<body>

<header>

<h1>🧬 AI EVOLUTION SIMULATOR</h1>

<div class="controls">
<button onclick="toggle()">▶ / ⏸</button>
<button onclick="reset()">↻ Reset</button>
<button onclick="changeSpeed(-1)">Speed −</button>
<button onclick="changeSpeed(1)">Speed +</button>
</div>

</header>

<div class="main">

<div class="world">
<canvas id="world"></canvas>
</div>

<div class="panel">

<div class="stat">
<div class="label">Generation</div>
<div class="value" id="generation">1</div>
</div>

<div class="stat">
<div class="label">Living Agents</div>
<div class="value" id="population">0</div>
</div>

<div class="stat">
<div class="label">Average Intelligence</div>
<div class="value" id="intelligence">0</div>
</div>

<div class="stat">
<div class="label">Best Fitness</div>
<div class="value" id="fitness">0</div>
</div>

<div class="stat">
<div class="label">Evolution Speed</div>
<div class="value" id="speed">1x</div>
</div>

<h3>🧠 Best Agents</h3>

<div id="agents"></div>

<h3>🌱 Evolution Events</h3>

<div class="log" id="log"></div>

<h3>Legend</h3>

<div class="legend">
🔵 AI Agent<br>
🟢 Food<br>
🟡 High Fitness<br>
⚪ Sensor Range
</div>

</div>
</div>

<script>

const canvas=document.getElementById("world");
const ctx=canvas.getContext("2d");

let W=0;
let H=0;

function resize(){

    W=canvas.width=canvas.clientWidth;
    H=canvas.height=canvas.clientHeight;

}

window.addEventListener("resize",resize);
resize();

let running=true;
let speed=1;
let generation=1;
let tick=0;

let agents=[];
let food=[];
let history=[];

let nextID=1;

const SENSOR_COUNT=5;

/*
    Neural network:

    Inputs:
    0 = food left
    1 = food right
    2 = food front
    3 = energy
    4 = random/environment signal

    Hidden layer:
    6 neurons

    Outputs:
    0 = move left
    1 = move right
    2 = move forward
    3 = rest
*/

class Brain{

    constructor(parent=null){

        if(parent){

            this.w1=mutateMatrix(parent.w1);
            this.w2=mutateMatrix(parent.w2);

        }else{

            this.w1=randomMatrix(5,6);
            this.w2=randomMatrix(6,4);

        }

    }

    think(inputs){

        const hidden=[];

        for(let j=0;j<6;j++){

            let sum=0;

            for(let i=0;i<5;i++)
                sum+=inputs[i]*this.w1[i][j];

            hidden[j]=Math.tanh(sum);

        }

        const output=[];

        for(let j=0;j<4;j++){

            let sum=0;

            for(let i=0;i<6;i++)
                sum+=hidden[i]*this.w2[i][j];

            output[j]=sum;

        }

        return output;

    }

}

function randomMatrix(rows,cols){

    const m=[];

    for(let i=0;i<rows;i++){

        m[i]=[];

        for(let j=0;j<cols;j++)
            m[i][j]=Math.random()*2-1;

    }

    return m;

}

function mutateMatrix(matrix){

    return matrix.map(row =>
        row.map(v =>
            Math.random()<0.08
            ?v+(Math.random()-.5)*1.2
            :v
        )
    );

}

class Agent{

    constructor(parent=null){

        this.id=nextID++;

        this.x=parent
            ?parent.x+(Math.random()-.5)*20
            :Math.random()*W;

        this.y=parent
            ?parent.y+(Math.random()-.5)*20
            :Math.random()*H;

        this.energy=parent
            ?70
            :60+Math.random()*40;

        this.age=0;

        this.foodEaten=0;

        this.fitness=0;

        this.speed=parent
            ?Math.max(
                .3,
                parent.speed+(Math.random()-.5)*.15
            )
            :.7+Math.random()*1.3;

        this.sight=parent
            ?Math.max(
                30,
                parent.sight+(Math.random()-.5)*12
            )
            :70+Math.random()*40;

        this.brain=parent
            ?new Brain(parent.brain)
            :new Brain();

        this.mutationRate=
            parent
            ?Math.max(
                .01,
                parent.mutationRate+(Math.random()-.5)*.02
            )
            :.08;

        this.action="Thinking";

    }

    sense(){

        let left=0;
        let right=0;
        let front=0;

        let closest=null;
        let closestDistance=Infinity;

        for(const f of food){

            const dx=f.x-this.x;
            const dy=f.y-this.y;

            const d=Math.hypot(dx,dy);

            if(d<this.sight && d<closestDistance){

                closest=f;
                closestDistance=d;

            }

        }

        if(closest){

            const angle=Math.atan2(
                closest.y-this.y,
                closest.x-this.x
            );

            const relative=angle-this.angle;

            if(Math.cos(relative)>.4)
                front=1/(closestDistance/this.sight);

            if(Math.sin(relative)>0)
                right=1/(closestDistance/this.sight);
            else
                left=1/(closestDistance/this.sight);

        }

        return [
            left,
            right,
            front,
            this.energy/100,
            Math.random()
        ];

    }

    update(){

        this.age++;

        this.energy-=0.045*this.speed;

        if(!this.angle)
            this.angle=Math.random()*Math.PI*2;

        const inputs=this.sense();

        const output=this.brain.think(inputs);

        let best=0;

        for(let i=1;i<output.length;i++){

            if(output[i]>output[best])
                best=i;

        }

        if(best===0){

            this.angle-=.12;
            this.action="Turning Left";

        }

        else if(best===1){

            this.angle+=.12;
            this.action="Turning Right";

        }

        else if(best===2){

            this.x+=Math.cos(this.angle)*this.speed;
            this.y+=Math.sin(this.angle)*this.speed;

            this.action="Exploring";

        }

        else{

            this.energy+=.08;
            this.action="Resting";

        }

        // boundaries

        if(this.x<5){
            this.x=5;
            this.angle=Math.PI-this.angle;
        }

        if(this.x>W-5){
            this.x=W-5;
            this.angle=Math.PI-this.angle;
        }

        if(this.y<5){
            this.y=5;
            this.angle=-this.angle;
        }

        if(this.y>H-5){
            this.y=H-5;
            this.angle=-this.angle;
        }

        // eating

        for(let i=food.length-1;i>=0;i--){

            const f=food[i];

            if(
                Math.hypot(
                    this.x-f.x,
                    this.y-f.y
                )<8
            ){

                this.energy+=28;
                this.foodEaten++;

                this.rememberFood();

                food.splice(i,1);

                break;

            }

        }

        // reproduction

        if(
            this.energy>145 &&
            this.age>80 &&
            Math.random()<.006
        ){

            this.energy*=.5;

            const child=new Agent(this);

            child.energy=75;

            agents.push(child);

            log(
                "AI-"+this.id+
                " reproduced → AI-"+child.id
            );

        }

        this.energy=Math.min(160,this.energy);

        this.fitness=
            this.foodEaten*50+
            this.age+
            this.energy*.4;

    }

    rememberFood(){

        if(Math.random()<.02){

            log(
                "AI-"+this.id+
                " learned a food location."
            );

        }

    }

}

function spawnFood(){

    const amount=Math.max(1,Math.floor(speed*2));

    for(let i=0;i<amount;i++){

        food.push({
            x:15+Math.random()*(W-30),
            y:15+Math.random()*(H-30),
            size:3+Math.random()*2
        });

    }

}

function createWorld(){

    agents=[];
    food=[];
    nextID=1;
    generation=1;
    tick=0;
    history=[];

    for(let i=0;i<45;i++)
        agents.push(new Agent());

    for(let i=0;i<180;i++)
        spawnFood();

    document.getElementById("log").innerHTML="";

    log("A new artificial ecosystem was created.");

}

function update(){

    if(!running)return;

    for(let s=0;s<speed;s++){

        tick++;

        spawnFood();

        for(const a of agents)
            a.update();

        // starvation / aging

        agents=agents.filter(a=>{

            if(a.energy<=0){

                if(Math.random()<.04)
                    log("AI-"+a.id+" died from starvation.");

                return false;

            }

            if(a.age>5000){

                if(Math.random()<.02)
                    log("AI-"+a.id+" died of old age.");

                return false;

            }

            return true;

        });

        // Evolution cycle

        if(agents.length<10){

            evolve();

        }

    }

}

function evolve(){

    if(agents.length===0){

        for(let i=0;i<20;i++)
            agents.push(new Agent());

        generation++;

        log("Total extinction. New life emerged.");

        return;

    }

    agents.sort(
        (a,b)=>b.fitness-a.fitness
    );

    const survivors=
        agents.slice(
            0,
            Math.max(5,Math.floor(agents.length*.25))
        );

    const oldCount=agents.length;

    const newAgents=[...survivors];

    while(newAgents.length<45){

        const parent=
            survivors[
                Math.floor(
                    Math.random()*survivors.length
                )
            ];

        newAgents.push(new Agent(parent));

    }

    agents=newAgents;

    generation++;

    const best=survivors[0];

    history.push({
        generation:generation,
        fitness:best.fitness
    });

    if(history.length>100)
        history.shift();

    log(
        "Generation "+
        generation+
        " evolved. Best fitness: "+
        Math.round(best.fitness)
    );

}

function draw(){

    ctx.clearRect(0,0,W,H);

    // environment

    ctx.fillStyle="#0c171d";
    ctx.fillRect(0,0,W,H);

    // subtle grid

    ctx.strokeStyle="rgba(130,170,190,.06)";
    ctx.lineWidth=1;

    for(let x=0;x<W;x+=50){

        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,H);
        ctx.stroke();

    }

    for(let y=0;y<H;y+=50){

        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(W,y);
        ctx.stroke();

    }

    // food

    for(const f of food){

        ctx.fillStyle="#38d978";

        ctx.beginPath();

        ctx.arc(
            f.x,
            f.y,
            f.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    // agents

    for(const a of agents){

        const high=a.fitness>
            Math.max(...agents.map(x=>x.fitness),1)*.8;

        ctx.globalAlpha=.09;
        ctx.strokeStyle="#fff";

        ctx.beginPath();

        ctx.arc(
            a.x,
            a.y,
            a.sight,
            0,
            Math.PI*2
        );

        ctx.stroke();

        ctx.globalAlpha=1;

        ctx.fillStyle=
            a.fitness>high
            ?"gold"
            :"#4ca6ff";

        ctx.beginPath();

        ctx.arc(
            a.x,
            a.y,
            5+Math.min(5,a.energy/35),
            0,
            Math.PI*2
        );

        ctx.fill();

        // direction

        ctx.strokeStyle="#dcecff";
        ctx.beginPath();

        ctx.moveTo(a.x,a.y);

        ctx.lineTo(
            a.x+Math.cos(a.angle)*10,
            a.y+Math.sin(a.angle)*10
        );

        ctx.stroke();

    }

    updateUI();

}

function updateUI(){

    document.getElementById("generation")
        .textContent=generation;

    document.getElementById("population")
        .textContent=agents.length;

    const avg=
        agents.reduce(
            (sum,a)=>sum+a.brain.w1.flat()
                .reduce((s,v)=>s+Math.abs(v),0),
            0
        )/(agents.length||1);

    document.getElementById("intelligence")
        .textContent=avg.toFixed(1);

    const best=
        Math.max(
            ...agents.map(a=>a.fitness),
            0
        );

    document.getElementById("fitness")
        .textContent=Math.round(best);

    document.getElementById("speed")
        .textContent=speed+"x";

    const box=document.getElementById("agents");

    box.innerHTML="";

    const top=
        [...agents]
        .sort((a,b)=>b.fitness-a.fitness)
        .slice(0,5);

    top.forEach(a=>{

        const div=document.createElement("div");

        div.className="agent";

        div.innerHTML=`

        <b>🤖 AI-${a.id}</b>

        <div class="small">
        Age: ${a.age}<br>
        Food learned: ${a.foodEaten}<br>
        Speed: ${a.speed.toFixed(2)}<br>
        Vision: ${Math.round(a.sight)}<br>
        Fitness: ${Math.round(a.fitness)}<br>
        Action: ${a.action}
        </div>

        <div class="small">
        Energy: ${Math.round(a.energy)}
        </div>

        <div class="bar">
        <div class="fill"
        style="width:${Math.min(100,a.energy/1.6)}%">
        </div>
        </div>

        `;

        box.appendChild(div);

    });

}

function log(message){

    const el=document.getElementById("log");

    const row=document.createElement("div");

    row.textContent=
        "G"+generation+" • "+message;

    el.prepend(row);

    while(el.children.length>50)
        el.lastChild.remove();

}

function toggle(){

    running=!running;

}

function changeSpeed(v){

    speed=Math.max(
        1,
        Math.min(20,speed+v)
    );

}

function reset(){

    createWorld();

}

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);

}

createWorld();
loop();

</script>

</body>
</html>
