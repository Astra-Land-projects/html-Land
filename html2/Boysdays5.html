<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>روز پسر مبارک</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Tahoma', sans-serif;
    background: linear-gradient(135deg,#0f0c29,#302b63,#24243e);
    color: #fff;
    overflow-x: hidden;
    min-height: 100vh;
  }
  canvas#bg { position:fixed; top:0; left:0; z-index:0; }
  .wrap {
    position: relative; z-index: 2;
    display:flex; flex-direction:column; align-items:center;
    padding: 60px 20px; text-align:center;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 4rem);
    background: linear-gradient(90deg,#ffd700,#ff8c00,#ffd700);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    background-size:200% auto;
    animation: shine 3s linear infinite, popIn 1s ease-out;
    text-shadow: 0 0 30px rgba(255,215,0,.3);
  }
  @keyframes shine { to { background-position:200% center; } }
  @keyframes popIn { from{opacity:0; transform:scale(.6);} to{opacity:1; transform:scale(1);} }

  .subtitle {
    font-size: clamp(1rem,2.5vw,1.4rem);
    color:#e0d7ff;
    margin-top:20px;
    min-height: 2.5em;
    border-left: 3px solid #ffd700;
    padding-right:10px;
  }

  .cards {
    display:flex; flex-wrap:wrap; justify-content:center; gap:20px;
    margin-top: 50px; max-width: 900px;
  }
  .card {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,215,0,.3);
    border-radius: 18px;
    padding: 25px 20px; width: 200px;
    backdrop-filter: blur(8px);
    transition: transform .3s, box-shadow .3s;
    opacity:0; transform: translateY(30px);
    animation: rise .8s forwards;
  }
  .card:nth-child(1){ animation-delay:.2s;}
  .card:nth-child(2){ animation-delay:.5s;}
  .card:nth-child(3){ animation-delay:.8s;}
  .card:nth-child(4){ animation-delay:1.1s;}
  @keyframes rise { to{opacity:1; transform:translateY(0);} }
  .card:hover { transform: translateY(-10px) scale(1.05); box-shadow:0 10px 30px rgba(255,215,0,.25); }
  .card .icon { font-size:2.5rem; margin-bottom:10px; }
  .card h3 { color:#ffd700; margin-bottom:8px; }
  .card p { font-size:.9rem; color:#ccc; }

  .btn {
    margin-top:50px;
    background: linear-gradient(90deg,#ffd700,#ff8c00);
    border:none; color:#1a1a2e; font-weight:bold;
    padding: 15px 40px; font-size:1.1rem;
    border-radius: 50px; cursor:pointer;
    box-shadow: 0 5px 25px rgba(255,140,0,.5);
    transition: transform .2s;
  }
  .btn:hover { transform: scale(1.08); }

  footer { margin-top:40px; color:#888; font-size:.85rem; }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div class="wrap">
  <h1>روز پسر مبارک 🎉</h1>
  <div class="subtitle" id="typewriter"></div>

  <div class="cards">
    <div class="card"><div class="icon">💪</div><h3>قدرت</h3><p>مردی که پشتوانه‌ی خانواده‌شه</p></div>
    <div class="card"><div class="icon">🛡️</div><h3>حمایت</h3><p>همیشه سنگ صبور بقیه</p></div>
    <div class="card"><div class="icon">❤️</div><h3>عشق</h3><p>مهربونی که یادش نمیره بگه</p></div>
    <div class="card"><div class="icon">🌟</div><h3>الهام</h3><p>الگویی برای نسل بعد</p></div>
  </div>

  <button class="btn" onclick="fire()">🎆 جشن بگیر!</button>
  <footer>ساخته شده با ❤️ برای همه‌ی پسرها و مردهای زندگیمون</footer>
</div>

<script>
// پارتیکل پس‌زمینه
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
canvas.width = innerWidth; canvas.height = innerHeight;
let particles = [];
for(let i=0;i<80;i++){
  particles.push({
    x: Math.random()*canvas.width,
    y: Math.random()*canvas.height,
    r: Math.random()*2+0.5,
    dx: (Math.random()-0.5)*0.5,
    dy: (Math.random()-0.5)*0.5,
    color: Math.random()>0.5 ? '255,215,0' : '255,255,255'
  });
}
function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    p.x+=p.dx; p.y+=p.dy;
    if(p.x<0||p.x>canvas.width) p.dx*=-1;
    if(p.y<0||p.y>canvas.height) p.dy*=-1;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle = `rgba(${p.color},0.6)`;
    ctx.fill();
  });
  requestAnimationFrame(animate);
}
animate();
window.onresize=()=>{canvas.width=innerWidth;canvas.height=innerHeight;};

// تایپ‌رایتر
const text = "به همه‌ی پسرها، برادرها و پدرهای عزیز... امروز روز شماست 🌹";
let i=0;
const tw = document.getElementById('typewriter');
function type(){
  if(i<text.length){ tw.textContent+=text.charAt(i); i++; setTimeout(type,45); }
}
type();

// فایرورک/کانفتی ساده با کلیک دکمه
function fire(){
  for(let i=0;i<150;i++){
    let conf = document.createElement('div');
    conf.style.position='fixed';
    conf.style.left = Math.random()*100+'vw';
    conf.style.top = '-10px';
    conf.style.width='8px'; conf.style.height='8px';
    conf.style.background = ['#ffd700','#ff8c00','#fff','#ff4757'][Math.floor(Math.random()*4)];
    conf.style.borderRadius='50%';
    conf.style.zIndex=999;
    conf.style.transition='top 2.5s ease-in, opacity 2.5s';
    document.body.appendChild(conf);
    setTimeout(()=>{ conf.style.top='110vh'; conf.style.opacity=0; },10);
    setTimeout(()=>conf.remove(),2600);
  }
}
</script>
</body>
</html>
