<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>روز پسر مبارک</title>
    <style>
        body { margin: 0; background: #0a1128; color: #f4d03f; font-family: Tahoma, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        canvas { position: absolute; top: 0; left: 0; z-index: 0; }
        .content { z-index: 1; text-align: center; background: rgba(0,0,0,0.6); padding: 30px; border-radius: 20px; border: 2px solid #f4d03f; box-shadow: 0 0 20px #f4d03f; }
        h1 { font-size: 3rem; margin-bottom: 20px; animation: glow 2s infinite alternate; }
        @keyframes glow { from { text-shadow: 0 0 10px #f4d03f; } to { text-shadow: 0 0 30px #f4d03f; } }
        button { background: #f4d03f; border: none; padding: 15px 30px; font-size: 1.2rem; cursor: pointer; border-radius: 10px; font-weight: bold; margin-top: 20px; }
        #badgeStage { margin-top: 20px; font-size: 1.5rem; font-weight: bold; }
    </style>
</head>
<body>
    <canvas id="confetti"></canvas>
    <div class="content">
        <h1>روز پسر مبارک! 👑</h1>
        <p id="msg">تو قهرمانِ دنیای خودت هستی.</p>
        <button onclick="showPersonality()">شخصیت پسرانه امروزت رو ببین</button>
        <div id="badgeStage"></div>
    </div>
    <script>
        const msgs = ["سخت‌کوش و با اراده 💪", "سفیر لبخند و مهربانی 😄", "پادشاه قلب‌ها 👑", "تکیه‌گاه استوار خانواده 🏛️"];
        function showPersonality() {
            const badge = msgs[Math.floor(Math.random() * msgs.length)];
            document.getElementById('badgeStage').innerText = "لقب امروزت: " + badge;
            // انفجار کانفتی ساده
            alert("تولدت مبارک قهرمان! 🎉");
        }
    </script>
</body>
</html>
