<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASTRA — TON 618</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

canvas{
    display:block;
}

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:10;
}

.panel{
    position:absolute;
    background:rgba(3,5,10,.65);
    border:1px solid rgba(255,255,255,.13);
    backdrop-filter:blur(8px);
    padding:16px 20px;
    box-shadow:0 0 40px rgba(0,0,0,.6);
}

.left{
    top:22px;
    left:22px;
}

.right{
    top:22px;
    right:22px;
    text-align:right;
}

.bottom{
    bottom:20px;
    left:22px;
}

.title{
    font-size:25px;
    font-weight:900;
    letter-spacing:6px;
}

.subtitle{
    color:#9da5b2;
    font-size:10px;
    letter-spacing:3px;
    margin-top:4px;
}

.stat{
    margin-top:10px;
    color:#aeb7c4;
    font-family:monospace;
    font-size:11px;
    line-height:1.8;
}

.stat b{
    color:white;
}

#hint{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    color:#777f8a;
    font-size:10px;
    letter-spacing:2px;
    white-space:nowrap;
}

#loading{
    position:fixed;
    inset:0;
    background:#000;
    z-index:100;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:opacity 1s;
}

.loadingText{
    text-align:center;
    letter-spacing:5px;
    color:#d5d8dd;
}

.loadingBar{
    width:240px;
    height:2px;
    background:#222;
    margin-top:15px;
    overflow:hidden;
}

.loadingBar div{
    height:100%;
    width:0;
    background:white;
    animation:load 2s forwards;
}

@keyframes load{
    to{
        width:100%;
    }
}
</style>

<script type="importmap">
{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

</head>

<body>

<div id="loading">
    <div class="loadingText">
        ASTRA · DEEP SPACE
        <div class="loadingBar">
            <div></div>
        </div>
    </div>
</div>

<div id="hud">

    <div class="panel left">

        <div class="title">
            TON 618
        </div>

        <div class="subtitle">
            ULTRAMASSIVE BLACK HOLE
        </div>

        <div class="stat">

            MASS
            <b>≈ 66 BILLION M☉</b>

            <br>

            TYPE
            <b>QUASAR</b>

            <br>

            CLASS
            <b>ACTIVE GALACTIC NUCLEUS</b>

        </div>

    </div>


    <div class="panel right">

        <div class="subtitle">
            OBSERVATION MODE
        </div>

        <div class="title" style="font-size:15px">
            EVENT HORIZON
        </div>

        <div class="stat" id="distance">
            DISTANCE: 0.00 AU
        </div>

    </div>


    <div class="panel bottom">

        <div class="subtitle">
            ASTRA SIMULATION
        </div>

        <div class="stat">
            DRAG · ORBIT
            &nbsp;&nbsp; | &nbsp;&nbsp;
            SCROLL · ZOOM
        </div>

    </div>


    <div id="hint">
        ACCRETION DISK · PHOTON RING · RELATIVISTIC JETS
    </div>

</div>


<script type="module">

import * as THREE from "three";

import {
    OrbitControls
} from "three/addons/controls/OrbitControls.js";


// ======================================================
// SCENE
// ======================================================

const scene = new THREE.Scene();


// ======================================================
// CAMERA
// ======================================================

const camera = new THREE.PerspectiveCamera(
    48,
    innerWidth / innerHeight,
    0.01,
    3000
);

camera.position.set(
    0,
    24,
    42
);


// ======================================================
// RENDERER
// ======================================================

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.15;

document.body.appendChild(
    renderer.domElement
);


// ======================================================
// CAMERA CONTROLS
// ======================================================

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;

controls.minDistance = 8;

controls.maxDistance = 180;


// ======================================================
// STAR FIELD
// ======================================================

const starGeometry =
    new THREE.BufferGeometry();

const STAR_COUNT = 17000;

const starPositions =
    new Float32Array(
        STAR_COUNT * 3
    );


for(let i=0;i<STAR_COUNT;i++){

    const radius =
        250 + Math.random()*650;

    const angle =
        Math.random()*Math.PI*2;

    const u =
        Math.random()*2-1;

    const s =
        Math.sqrt(1-u*u);


    starPositions[i*3] =
        radius*s*Math.cos(angle);

    starPositions[i*3+1] =
        radius*u;

    starPositions[i*3+2] =
        radius*s*Math.sin(angle);
}


starGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        starPositions,
        3
    )
);


const starMaterial =
    new THREE.PointsMaterial({

        color:0xaeb7c8,

        size:.65,

        sizeAttenuation:true,

        transparent:true,

        opacity:.8
    });


const stars =
    new THREE.Points(
        starGeometry,
        starMaterial
    );


scene.add(stars);


// ======================================================
// BLACK HOLE
// ======================================================

const blackHoleGeometry =
    new THREE.SphereGeometry(
        6.2,
        64,
        64
    );


const blackHoleMaterial =
    new THREE.MeshBasicMaterial({
        color:0x000000
    });


const blackHole =
    new THREE.Mesh(
        blackHoleGeometry,
        blackHoleMaterial
    );


scene.add(
    blackHole
);


// ======================================================
// PHOTON RING
// ======================================================

const photonRing =
    new THREE.Mesh(

        new THREE.RingGeometry(
            6.7,
            7.15,
            256
        ),

        new THREE.MeshBasicMaterial({

            color:0xffd18a,

            transparent:true,

            opacity:.9,

            side:THREE.DoubleSide,

            blending:
                THREE.AdditiveBlending

        })

    );


photonRing.rotation.x =
    Math.PI/2;


scene.add(
    photonRing
);


// ======================================================
// PHOTON RING GLOW
// ======================================================

const photonGlow =
    new THREE.Mesh(

        new THREE.RingGeometry(
            7,
            8.2,
            256
        ),

        new THREE.MeshBasicMaterial({

            color:0xff7b25,

            transparent:true,

            opacity:.16,

            side:THREE.DoubleSide,

            blending:
                THREE.AdditiveBlending

        })

    );


photonGlow.rotation.x =
    Math.PI/2;


scene.add(
    photonGlow
);


// ======================================================
// ACCRETION DISK
// ======================================================

const DISK_COUNT = 65000;

const diskPositions =
    new Float32Array(
        DISK_COUNT * 3
    );

const diskColors =
    new Float32Array(
        DISK_COUNT * 3
    );


const diskRadius =
    new Float32Array(
        DISK_COUNT
    );

const diskAngle =
    new Float32Array(
        DISK_COUNT
    );


for(let i=0;i<DISK_COUNT;i++){

    const random =
        Math.random();

    const radius =
        8 +
        Math.pow(
            random,
            1.75
        ) * 72;


    const angle =
        Math.random() *
        Math.PI*2;


    diskRadius[i] =
        radius;

    diskAngle[i] =
        angle;


    const thickness =
        (Math.random()-.5) *
        (
            .35 +
            2.2 *
            (radius/80)
        );


    diskPositions[i*3] =
        Math.cos(angle) *
        radius;

    diskPositions[i*3+1] =
        thickness;

    diskPositions[i*3+2] =
        Math.sin(angle) *
        radius;


    const heat =
        1 -
        (radius-8)/72;


    diskColors[i*3] =
        1;

    diskColors[i*3+1] =
        .12 +
        .65*heat;

    diskColors[i*3+2] =
        .015 +
        .18*heat;
}


const diskGeometry =
    new THREE.BufferGeometry();


diskGeometry.setAttribute(
    "position",

    new THREE.BufferAttribute(
        diskPositions,
        3
    )
);


diskGeometry.setAttribute(
    "color",

    new THREE.BufferAttribute(
        diskColors,
        3
    )
);


const diskMaterial =
    new THREE.PointsMaterial({

        size:.13,

        vertexColors:true,

        transparent:true,

        opacity:.9,

        blending:
            THREE.AdditiveBlending,

        depthWrite:false
    });


const disk =
    new THREE.Points(
        diskGeometry,
        diskMaterial
    );


scene.add(
    disk
);


// ======================================================
// GLOWING DISK RINGS
// ======================================================

function createGlowRing(
    radius,
    width,
    opacity,
    color
){

    const geometry =
        new THREE.RingGeometry(
            radius,
            radius+width,
            256
        );


    const material =
        new THREE.MeshBasicMaterial({

            color,

            transparent:true,

            opacity,

            side:THREE.DoubleSide,

            blending:
                THREE.AdditiveBlending,

            depthWrite:false

        });


    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );


    mesh.rotation.x =
        Math.PI/2;


    scene.add(mesh);

    return mesh;
}


const glow1 =
    createGlowRing(
        10,
        7,
        .18,
        0xff4b12
    );


const glow2 =
    createGlowRing(
        18,
        12,
        .08,
        0xff9b32
    );


const glow3 =
    createGlowRing(
        32,
        22,
        .035,
        0xffc36a
    );


// ======================================================
// RELATIVISTIC JETS
// ======================================================

const JET_COUNT = 9000;

const jetPositions =
    new Float32Array(
        JET_COUNT * 3
    );

const jetColors =
    new Float32Array(
        JET_COUNT * 3
    );


for(let i=0;i<JET_COUNT;i++){

    const side =
        i%2 === 0
        ? 1
        : -1;


    const y =
        side *
        (
            8 +
            Math.random()*110
        );


    const fraction =
        (Math.abs(y)-8)/110;


    const radius =
        (1-fraction)*2.8 +
        Math.random()*2.5;


    const angle =
        Math.random()*Math.PI*2;


    jetPositions[i*3] =
        Math.cos(angle)*radius;

    jetPositions[i*3+1] =
        y;

    jetPositions[i*3+2] =
        Math.sin(angle)*radius;


    jetColors[i*3] =
        .55 +
        .45*(1-fraction);

    jetColors[i*3+1] =
        .68 +
        .3*(1-fraction);

    jetColors[i*3+2] =
        1;
}


const jetGeometry =
    new THREE.BufferGeometry();


jetGeometry.setAttribute(
    "position",

    new THREE.BufferAttribute(
        jetPositions,
        3
    )
);


jetGeometry.setAttribute(
    "color",

    new THREE.BufferAttribute(
        jetColors,
        3
    )
);


const jetMaterial =
    new THREE.PointsMaterial({

        size:.18,

        vertexColors:true,

        transparent:true,

        opacity:.5,

        blending:
            THREE.AdditiveBlending,

        depthWrite:false
    });


const jets =
    new THREE.Points(
        jetGeometry,
        jetMaterial
    );


scene.add(
    jets
);


// ======================================================
// LIGHT
// ======================================================

const light =
    new THREE.PointLight(
        0xff9b4a,
        8,
        140
    );

light.position.set(
    0,
    5,
    0
);

scene.add(
    light
);


// ======================================================
// ANIMATION
// ======================================================

let time = 0;


function animate(){

    requestAnimationFrame(
        animate
    );


    time += .003;


    // Accretion disk rotation
    disk.rotation.y += .002;


    // Photon ring motion
    photonRing.rotation.z =
        time*.2;

    photonGlow.rotation.z =
        -time*.12;


    // Glow layers
    glow1.rotation.z =
        time*.15;

    glow2.rotation.z =
        -time*.1;

    glow3.rotation.z =
        time*.05;


    // Small brightness fluctuations
    light.intensity =
        7.5 +
        Math.sin(time*18)*.8;


    // Slowly rotate background
    stars.rotation.y += .00003;


    controls.update();


    // Fake observation distance
    document.getElementById(
        "distance"
    ).textContent =
        "DISTANCE: " +
        (
            camera.position.length()/12
        ).toFixed(2) +
        " AU";


    renderer.render(
        scene,
        camera
    );
}


animate();


// ======================================================
// RESIZE
// ======================================================

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


// ======================================================
// LOADING SCREEN
// ======================================================

setTimeout(()=>{

    const loading =
        document.getElementById(
            "loading"
        );

    loading.style.opacity = "0";

    setTimeout(
        ()=>loading.remove(),
        1000
    );

},2100);

</script>

</body>
</html>
