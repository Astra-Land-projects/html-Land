<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 11 Astra Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body { height: 100vh; width: 100vw; overflow: hidden; position: relative; }

        /* Video Background */
        #bg-video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Desktop Overlay Icons */
        .desktop {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 48px;
            z-index: 2;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-content: flex-start;
        }

        .desktop-icon {
            width: 80px;
            text-align: center;
            color: white;
            font-size: 0.75rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            transition: 0.2s;
        }
        .desktop-icon:hover { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(5px); }
        .desktop-icon div { font-size: 2rem; margin-bottom: 4px; }

        /* Taskbar Windows 11 */
        .taskbar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 48px;
            background: rgba(15, 15, 20, 0.65);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
        }

        .taskbar-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
        }

        .tb-icon {
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.2rem;
            color: #fff;
            transition: 0.2s;
        }
        .tb-icon:hover { background: rgba(255, 255, 255, 0.15); }
        .tb-icon.active { background: rgba(255, 255, 255, 0.2); position: relative; }
        .tb-icon.active::after {
            content: ''; position: absolute; bottom: 2px; width: 12px; height: 3px; background: #00e5ff; border-radius: 2px;
        }

        .taskbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #fff;
            font-size: 0.75rem;
            text-align: left;
        }

        /* Start Menu */
        .start-menu {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            width: 520px;
            height: 450px;
            background: rgba(20, 20, 30, 0.85);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            z-index: 99;
            display: none;
            opacity: 0;
            transition: all 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
            padding: 25px;
            color: #fff;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }
        .start-menu.open {
            display: block;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .start-search {
            width: 100%;
            padding: 10px 15px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            color: #fff;
            outline: none;
            margin-bottom: 20px;
        }

        .pinned-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            text-align: center;
        }
        .pinned-item {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .pinned-item:hover { background: rgba(255,255,255,0.1); }
        .pinned-item div { font-size: 1.8rem; margin-bottom: 5px; }

        /* Draggable Window */
        .window {
            position: absolute;
            top: 80px; left: 150px;
            width: 700px; height: 450px;
            background: rgba(18, 18, 26, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 10px;
            z-index: 10;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .window-header {
            height: 38px;
            background: rgba(10, 10, 15, 0.8);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px;
            cursor: move;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .win-title { color: #aaa; font-size: 0.8rem; }
        .win-controls { display: flex; gap: 8px; }
        .win-btn { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; }
        .close-btn { background: #ff5f56; }
        .min-btn { background: #ffbd2e; }
        .max-btn { background: #27c93f; }

        .window-body { flex: 1; padding: 20px; color: #fff; }
    </style>
</head>
<body>

    <!-- Video Background -->
    <video id="bg-video" autoplay loop muted>
        <source src="arya.mp4" type="video/mp4">
    </video>

    <!-- Desktop Icons -->
    <div class="desktop">
        <div class="desktop-icon" onclick="toggleWindow()">
            <div>🖥️</div>
            <span>Astra Engine</span>
        </div>
        <div class="desktop-icon">
            <div>📁</div>
            <span>پروژه‌ها</span>
        </div>
        <div class="desktop-icon">
            <div>🌐</div>
            <span>مرورگر</span>
        </div>
    </div>

    <!-- Interactive Window -->
    <div class="window" id="appWindow">
        <div class="window-header" id="winHeader">
            <span class="win-title">Astra Cyber Dashboard</span>
            <div class="win-controls">
                <div class="win-btn min-btn"></div>
                <div class="win-btn max-btn"></div>
                <div class="win-btn close-btn" onclick="toggleWindow()"></div>
            </div>
        </div>
        <div class="window-body">
            <h2 style="color: #00e5ff; margin-bottom: 10px;">خوش آمدید به Astra OS</h2>
            <p style="color: #ccc; line-height: 1.6;">سیستم‌عامل شبیه‌سازی‌شده با پس‌زمینه زنده و گرافیک اختصاصی جهت ضبط ویدیوهای حرفه‌ای.</p>
        </div>
    </div>

    <!-- Start Menu -->
    <div class="start-menu" id="startMenu">
        <input type="text" class="start-search" placeholder="جستجو در برنامه‌ها و فایل‌ها...">
        <p style="font-size: 0.8rem; color: #888; margin-bottom: 15px;">برنامه‌های سنجاق‌شده</p>
        <div class="pinned-grid">
            <div class="pinned-item"><div>⚙️</div>تنظیمات</div>
            <div class="pinned-item"><div>🎬</div>ادیتور ویدیو</div>
            <div class="pinned-item"><div>🎨</div>فتوشاپ</div>
            <div class="pinned-item"><div>💻</div>ترمینال</div>
        </div>
    </div>

    <!-- Windows 11 Taskbar -->
    <div class="taskbar">
        <div></div>
        <div class="taskbar-center">
            <div class="tb-icon" onclick="toggleStart()">🪟</div>
            <div class="tb-icon active" onclick="toggleWindow()">💻</div>
            <div class="tb-icon">📁</div>
            <div class="tb-icon">🌐</div>
        </div>
        <div class="taskbar-right">
            <div>FA</div>
            <div id="clockDisplay" style="direction: ltr;">12:00<br><span style="font-size:0.65rem; color:#aaa;">2026/09/09</span></div>
        </div>
    </div>

    <script>
        // Start Menu Toggle
        function toggleStart() {
            const menu = document.getElementById('startMenu');
            menu.classList.toggle('open');
        }

        // Window Toggle
        function toggleWindow() {
            const win = document.getElementById('appWindow');
            win.style.display = win.style.display === 'none' ? 'flex' : 'none';
        }

        // Draggable Window Logic
        const win = document.getElementById('appWindow');
        const header = document.getElementById('winHeader');
        let isDragging = false, offsetRight = 0, offsetTop = 0;

        header.addEventListener('mousedown', (e) => {
            isDragging = true;
            offsetRight = e.clientX - win.offsetLeft;
            offsetTop = e.clientY - win.offsetTop;
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                win.style.left = (e.clientX - offsetRight) + 'px';
                win.style.top = (e.clientY - offsetTop) + 'px';
            }
        });

        document.addEventListener('mouseup', () => isDragging = false);

        // Clock Function
        function updateClock() {
            const now = new Date();
            const time = now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
            const date = now.toLocaleDateString('fa-IR');
            document.getElementById('clockDisplay').innerHTML = `${time}<br><span style="font-size:0.65rem; color:#aaa;">${date}</span>`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
