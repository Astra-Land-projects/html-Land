<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>تولدت مبارک!</title>
    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Tahoma', sans-serif;
            direction: rtl;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #e74c3c;
            font-size: 2.5em;
        }
        p {
            font-size: 1.2em;
            color: #333;
        }
        .emoji {
            font-size: 3em;
        }
        button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji">🎂🎈🎉</div>
        <h1>تولدت مبارک!</h1>
        <p>داداش جان، بهترین‌ها رو برات آرزو می‌کنم. 🥳</p>
        <p>امیدوارم سال جدید زندگیت پر از شادی و موفقیت باشه ❤️</p>
        <button onclick="alert('🎉 تولدت مبارک داداش! دوستت دارم ❤️')">کلیک کن!</button>
    </div>
</body>
</html>
