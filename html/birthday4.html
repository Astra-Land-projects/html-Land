<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>تولدت مبارک!</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .balloons {
            font-size: 60px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
        }
        .gift-box {
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        button {
            background: #ff4081;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            font-family: Tahoma;
        }
        button:hover {
            background: #e91e63;
            transform: scale(1.1);
        }
        #message {
            display: none;
            margin-top: 20px;
            font-size: 22px;
            animation: fadeIn 1s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="balloons">🎈🎁🎈</div>
    <div class="gift-box">
        <h1>سلام!</h1>
        <p>یہ کادوی کوچیک از طرف هوش مصنوعی براتونه 🤖</p>
        <button onclick="openGift()">باز کردن کادو 🎁</button>
        <div id="message">
            <strong>تولدت مبارک! 🎂</strong><br>
            امیدوارم سال جدید پر از خوشبختی، سلامتی و موفقیت باشه.<br>
            این یه پروژه ساده بود که با عشق برات ساختم! ❤️
        </div>
    </div>

    <script>
        function openGift() {
            document.getElementById("message").style.display = "block";
            // ایجاد افکت کانفتی (نمادین)
            for(let i=0; i<20; i++) {
                let confetti = document.createElement('div');
                confetti.innerText = '🎉';
                confetti.style.position = 'absolute';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = Math.random() * 100 + 'vh';
                confetti.style.fontSize = Math.random() * 20 + 10 + 'px';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 2000);
            }
        }
    </script>
</body>
</html>
