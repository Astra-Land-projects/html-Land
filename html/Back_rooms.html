<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Backrooms - Immersive Experience</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; }
        #instructions {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); color: #c6b56a;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; z-index: 100; cursor: pointer;
        }
        #hud {
            position: absolute; bottom: 20px; left: 20px; color: #c6b56a;
            font-size: 18px; pointer-events: none; z-index: 50;
        }
        canvas { display: block; }
    </style>
</head>
<body>

    <div id="instructions">
        <h1 style="font-size: 50px;">THE BACKROOMS</h1>
        <p style="font-size: 20px;">Level 0: The Lobby</p>
        <p>[ CLICK TO START ]</p>
        <p style="color: #888; font-size: 14px;">(WASD to move, Mouse to look around)</p>
    </div>

    <div id="hud">LOCATION: UNKNOWN | SIGNAL: WEAK</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        let scene, camera, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let prevTime = performance.now();

        const textureLoader = new THREE.TextureLoader();

        // --- TEXTURE GENERATOR (To avoid external file issues) ---
        function createWallTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            // Base color (Yellowish wallpaper)
            ctx.fillStyle = '#d4c06e';
            ctx.fillRect(0, 0, 512, 512);
            // Add subtle pattern (dots/grain)
            for (let i = 0; i < 10000; i++) {
                ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.05})`;
                ctx.fillRect(Math.random() * 512, Math.random() * 512, 1, 1);
            }
            // Add some subtle vertical stripes
            ctx.fillStyle = 'rgba(0,0,0,0.03)';
            for(let i=0; i<512; i+=4) ctx.fillRect(i, 0, 1, 512);
           
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function createCarpetTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#8b7355'; // Brownish carpet
            ctx.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 20000; i++) {
                ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.1})`;
                ctx.fillRect(Math.random() * 512, Math.random() * 512, 1, 1);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        // --- CORE ENGINE ---
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111100);
            scene.fog = new THREE.FogExp2(0xd4c06e, 0.08); // Deep fog for the creepy effect

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
           
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            controls = new PointerLockControls(camera, document.body);
            const instructions = document.getElementById('instructions');
            instructions.addEventListener('click', () => {
                controls.lock();
            });

            controls.addEventListener('lock', () => instructions.style.display = 'none');
            controls.addEventListener('unlock', () => instructions.style.display = 'flex');

            // Create the World
            buildWorld();

            // Listeners
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function buildWorld() {
            const wallTex = createWallTexture();
            const floorTex = createCarpetTexture();

            // Floor
            const floorGeo = new THREE.PlaneGeometry(200, 200);
            const floorMat = new THREE.MeshStandardMaterial({ map: floorTex });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Ceiling
            const ceiling = new THREE.Mesh(floorGeo, new THREE.MeshStandardMaterial({ color: 0xaaaaaa }));
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.y = 3.5;
            scene.add(ceiling);

            // Walls - Generating a "Maze" pattern
            const wallGeo = new THREE.BoxGeometry(1, 3.5, 1);
            const wallMat = new THREE.MeshStandardMaterial({ map: wallTex });

            for (let i = 0; i < 150; i++) {
                const wall = new THREE.Mesh(wallGeo, wallMat);
                // Random positioning but keeping it within a "maze" feel
                wall.position.x = Math.floor(Math.random() * 40 - 20) * 2;
                wall.position.z = Math.floor(Math.random() * 40 - 20) * 2;
                wall.position.y = 1.75;
               
                // Randomly make them long walls or small blocks
                if (Math.random() > 0.7) {
                    const longWallGeo = new THREE.BoxGeometry(1, 3.5, 6);
                    const longWall = new THREE.Mesh(longWallGeo, wallMat);
                    longWall.position.set(wall.position.x, 1.75, wall.position.z);
                    scene.add(longWall);
                } else {
                    scene.add(wall);
                }
            }

            // Lighting - The "Fluorescent" Look
            const ambient = new THREE.AmbientLight(0xfffbd1, 0.2);
            scene.add(ambient);

            // Add some "flickering" lights in the scene
            for(let i=0; i<10; i++) {
                const pLight = new THREE.PointLight(0xfffbd1, 0.8, 20);
                pLight.position.set(Math.random()*40-20, 3, Math.random()*40-20);
                scene.add(pLight);
            }
        }

        function onKeyDown(event) {
            switch (event.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyD': moveRight = true; break;
            }
        }

        function onKeyUp(event) {
            switch (event.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyD': moveRight = false; break;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (controls.isLocked) {
                // Friction
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 100.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 100.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
