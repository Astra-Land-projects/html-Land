<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System — Live Orbit Simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #05070d;
    --bg-deep: #020306;
    --sun: #ffcf7a;
    --sun-core: #fff3d6;
    --accent: #6fe3ff;
    --text: #e7ecf5;
    --text-dim: #8b96ab;
    --highlight: #ff8a65;
    --panel-bg: rgba(9, 13, 24, 0.72);
    --border: rgba(111, 227, 255, 0.18);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background: radial-gradient(ellipse at 50% 30%, #0a0f1e 0%, var(--bg-deep) 70%);
    font-family:'Inter',sans-serif; color:var(--text);
  }
  canvas{ display:block; }

  .title{
    position:fixed; top:20px; left:24px; z-index:5;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700; font-size:15px; letter-spacing:0.18em;
    text-transform:uppercase; color:var(--text);
    display:flex; align-items:baseline; gap:10px;
  }
  .title span{
    font-weight:400; font-size:10px; letter-spacing:0.14em;
    color:var(--text-dim); text-transform:none;
  }

  .controls{
    position:fixed; bottom:20px; left:24px; z-index:5;
    background:var(--panel-bg); border:1px solid var(--border);
    border-radius:14px; padding:14px 18px;
    backdrop-filter: blur(10px);
    display:flex; align-items:center; gap:16px;
    font-family:'Inter',sans-serif;
  }
  .btn{
    width:34px; height:34px; border-radius:50%;
    border:1px solid var(--border); background:rgba(111,227,255,0.06);
    color:var(--accent); cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:14px; transition: background 0.2s ease, transform 0.15s ease;
  }
  .btn:hover{ background:rgba(111,227,255,0.16); transform:scale(1.06); }
  .btn:active{ transform:scale(0.94); }

  .speed-wrap{ display:flex; flex-direction:column; gap:4px; min-width:150px; }
  .speed-label{ font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-dim); }
  input[type=range]{
    -webkit-appearance:none; width:100%; height:3px; border-radius:3px;
    background:rgba(255,255,255,0.14); outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
    background:var(--accent); cursor:pointer; box-shadow:0 0 8px rgba(111,227,255,0.7);
  }
  input[type=range]::-moz-range-thumb{
    width:13px; height:13px; border-radius:50%; border:none;
    background:var(--accent); cursor:pointer; box-shadow:0 0 8px rgba(111,227,255,0.7);
  }

  .hint{
    position:fixed; bottom:20px; right:24px; z-index:5;
    font-size:11px; color:var(--text-dim); letter-spacing:0.03em;
    background:var(--panel-bg); border:1px solid var(--border);
    border-radius:10px; padding:8px 12px; backdrop-filter: blur(10px);
  }

  .info-panel{
    position:fixed; top:20px; right:24px; z-index:6;
    width:250px; background:var(--panel-bg); border:1px solid var(--border);
    border-radius:16px; padding:18px 20px; backdrop-filter: blur(12px);
    opacity:0; transform:translateY(-8px); pointer-events:none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .info-panel.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .info-eyebrow{
    font-size:10px; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--accent); margin-bottom:6px; font-weight:600;
  }
  .info-name{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px;
    margin:0 0 10px 0; color:var(--text);
  }
  .info-fact{
    font-size:12.5px; line-height:1.55; color:var(--text-dim); margin:0 0 12px 0;
  }
  .info-stats{ display:flex; flex-direction:column; gap:5px; }
  .info-stat{
    display:flex; justify-content:space-between; font-size:11px;
    color:var(--text-dim); border-top:1px solid var(--border); padding-top:5px;
  }
  .info-stat b{ color:var(--text); font-weight:600; }
  .info-close{
    position:absolute; top:14px; right:16px; background:none; border:none;
    color:var(--text-dim); cursor:pointer; font-size:16px; line-height:1;
  }
</style>
</head>
<body>

<div class="title">SOLAR SYSTEM <span>live orbit simulation</span></div>

<canvas id="scene"></canvas>

<div class="info-panel" id="infoPanel">
  <button class="info-close" id="infoClose">&times;</button>
  <div class="info-eyebrow" id="infoEyebrow">Planet</div>
  <h2 class="info-name" id="infoName">—</h2>
  <p class="info-fact" id="infoFact">—</p>
  <div class="info-stats">
    <div class="info-stat"><span id="statLabel1">Orbital period</span><b id="infoPeriod">—</b></div>
    <div class="info-stat"><span id="statLabel2">Relative size</span><b id="infoSize">—</b></div>
  </div>
</div>

<div class="controls">
  <button class="btn" id="playPause">⏸</button>
  <div class="speed-wrap">
    <div class="speed-label">Orbit Speed</div>
    <input type="range" id="speedSlider" min="0" max="300" value="100">
  </div>
</div>

<div class="hint">Click the Sun, a planet, or the Moon for details · drag slider to change speed</div>

<script>
(function(){
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  let W, H, cx, cy, scale = 1;

  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cx = W / 2;
    cy = H / 2;
    scale = Math.min(W, H) / 820;
    scale = Math.max(0.4, Math.min(1.3, scale));
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Starfield ----------
  const stars = [];
  const STAR_COUNT = 260;
  for(let i=0;i<STAR_COUNT;i++){
    stars.push({
      x: Math.random(),
      y: Math.random(),
      r: Math.random()*1.3 + 0.3,
      baseAlpha: Math.random()*0.5 + 0.3,
      twinkleSpeed: Math.random()*0.02 + 0.005,
      phase: Math.random()*Math.PI*2
    });
  }

  // ---------- Planet data ----------
  // orbitRadius in "AU units" scaled for display, size in px, speed = relative angular velocity
  const planets = [
    { name:'Mercury', color:'#b7b1a8', size:4,  orbitAU:52,  periodDays:88,   fact:'The smallest and fastest planet, completing an orbit in just 88 days.', ring:false },
    { name:'Venus',   color:'#e8c99b', size:7,  orbitAU:78,  periodDays:225,  fact:'The hottest planet, with a thick atmosphere that traps heat like a greenhouse.', ring:false },
    { name:'Earth',   color:'#5aa9e6', size:7.5,orbitAU:108, periodDays:365,  fact:'The only known planet with liquid water on its surface and life.', ring:false, moon:true },
    { name:'Mars',    color:'#c1552c', size:5.5,orbitAU:140, periodDays:687,  fact:'Known as the Red Planet for the iron oxide dust covering its surface.', ring:false },
    { name:'Jupiter', color:'#d9a86c', size:16, orbitAU:210, periodDays:4333, fact:'The largest planet — its Great Red Spot is a storm bigger than Earth.', ring:false, bands:true },
    { name:'Saturn',  color:'#e8d5a3', size:14, orbitAU:270, periodDays:10759,fact:'Famous for its bright icy rings made of billions of rock and ice fragments.', ring:true, bands:true },
    { name:'Uranus',  color:'#a9dede', size:10, orbitAU:320, periodDays:30687,fact:'Spins almost on its side, likely tipped over by an ancient collision.', ring:false, bands:true },
    { name:'Neptune', color:'#5b7fe0', size:9.5,orbitAU:365, periodDays:60190,fact:'The windiest planet, with storms reaching over 2,000 km/h.', ring:false, bands:true },
    { name:'Pluto',   color:'#c9b8a8', size:2.8,orbitAU:410, periodDays:90520,fact:'Reclassified as a dwarf planet in 2006 — its orbit is tilted and stretched compared to the others.', ring:false, dwarf:true }
  ];

  // Base angular speed reference: Mercury's period maps to a visible speed
  const REF_PERIOD = planets[0].periodDays;
  planets.forEach(p=>{
    p.angle = Math.random() * Math.PI * 2;
    p.baseSpeed = (REF_PERIOD / p.periodDays) * 0.018; // radians per frame at 1x
  });

  // The Sun — clickable for its own info card
  const sun = {
    name:'Sun', isSun:true, periodDays:null,
    fact:'A G-type star holding 99.8% of the solar system\'s mass. Light from its surface takes about 8 minutes to reach Earth.',
    statLabel:'Surface temp.', statValue:'5,500 °C', color:'#ffcf7a', _x:0, _y:0
  };

  // The Moon — orbits Earth, tracked separately so it can be clicked for its own info
  const moon = {
    name:'Moon', isMoon:true, size:1.8, periodDays:27.3,
    distanceLabel:'384,400 km from Earth',
    fact:'Earth\'s only natural satellite, formed from debris after a massive early collision. It always shows the same face to Earth.',
    color:'#cfd6e0', _x:0, _y:0
  };

  // Asteroid belt between Mars and Jupiter
  const asteroids = [];
  for(let i=0;i<90;i++){
    asteroids.push({
      angle: Math.random()*Math.PI*2,
      baseRadius: 160 + Math.random()*30,
      speed: (0.006 + Math.random()*0.004) * (Math.random()<0.5?1:-0.15),
      size: Math.random()*1.2 + 0.4,
      alpha: Math.random()*0.4+0.3
    });
  }

  // ---------- State ----------
  let speedMultiplier = 1.0;
  let paused = false;
  let selected = null;
  let hovered = null;
  let time = 0;

  const speedSlider = document.getElementById('speedSlider');
  speedSlider.addEventListener('input', e=>{
    speedMultiplier = e.target.value / 100;
  });

  const playPauseBtn = document.getElementById('playPause');
  playPauseBtn.addEventListener('click', ()=>{
    paused = !paused;
    playPauseBtn.textContent = paused ? '▶' : '⏸';
  });

  const infoPanel = document.getElementById('infoPanel');
  const infoName = document.getElementById('infoName');
  const infoFact = document.getElementById('infoFact');
  const infoEyebrow = document.getElementById('infoEyebrow');
  const infoPeriod = document.getElementById('infoPeriod');
  const infoSize = document.getElementById('infoSize');
  document.getElementById('infoClose').addEventListener('click', ()=>{
    selected = null;
    infoPanel.classList.remove('show');
  });

  const statLabel1 = document.getElementById('statLabel1');
  const statLabel2 = document.getElementById('statLabel2');

  function showInfo(p){
    selected = p;
    infoName.textContent = p.name;
    infoFact.textContent = p.fact;

    if(p.isSun){
      infoEyebrow.textContent = 'Star';
      statLabel1.textContent = 'Type';
      infoPeriod.textContent = 'G-type star';
      statLabel2.textContent = p.statLabel;
      infoSize.textContent = p.statValue;
    } else if(p.isMoon){
      infoEyebrow.textContent = 'Natural Satellite';
      statLabel1.textContent = 'Orbital period';
      infoPeriod.textContent = Math.round(p.periodDays) + ' Earth days';
      statLabel2.textContent = 'Distance';
      infoSize.textContent = p.distanceLabel;
    } else {
      infoEyebrow.textContent = p.dwarf ? 'Dwarf Planet' : (p.orbitAU < 150 ? 'Inner Planet' : 'Outer Planet');
      statLabel1.textContent = 'Orbital period';
      infoPeriod.textContent = p.periodDays >= 365
        ? (p.periodDays/365).toFixed(1) + ' Earth years'
        : Math.round(p.periodDays) + ' Earth days';
      statLabel2.textContent = 'Relative size';
      infoSize.textContent = (p.size/7.5).toFixed(2) + '× Earth';
    }
    infoPanel.classList.add('show');
  }

  // ---------- Interaction ----------
  function hitTest(mx, my){
    let closest = null, closestDist = 22;
    planets.forEach(p=>{
      const d = Math.hypot(mx - p._x, my - p._y);
      const threshold = Math.max(16, p.size*scale*2.4);
      if(d < threshold && d < closestDist){ closestDist = d; closest = p; }
    });
    const dMoon = Math.hypot(mx - moon._x, my - moon._y);
    if(dMoon < 12 && dMoon < closestDist){ closestDist = dMoon; closest = moon; }
    const dSun = Math.hypot(mx - sun._x, my - sun._y);
    if(dSun < Math.max(26, 26*scale) && dSun < closestDist){ closest = sun; }
    return closest;
  }

  canvas.addEventListener('click', (e)=>{
    const found = hitTest(e.clientX, e.clientY);
    if(found){ showInfo(found); }
  });

  canvas.addEventListener('mousemove', (e)=>{
    hovered = hitTest(e.clientX, e.clientY);
    canvas.style.cursor = hovered ? 'pointer' : 'default';
  });

  // ---------- Drawing ----------
  function drawStars(){
    ctx.save();
    stars.forEach(s=>{
      const tw = Math.sin(time*s.twinkleSpeed + s.phase) * 0.3;
      ctx.globalAlpha = Math.max(0, s.baseAlpha + tw);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.restore();
  }

  function drawSun(){
    sun._x = cx; sun._y = cy;
    const pulse = Math.sin(time*0.03) * 3;
    const r = (26 + pulse) * scale;
    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, r*4.2);
    glow.addColorStop(0, 'rgba(255,207,122,0.55)');
    glow.addColorStop(0.4, 'rgba(255,180,90,0.16)');
    glow.addColorStop(1, 'rgba(255,180,90,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, r*4.2, 0, Math.PI*2);
    ctx.fill();

    const core = ctx.createRadialGradient(cx-6, cy-6, 2, cx, cy, r);
    core.addColorStop(0, '#fff3d6');
    core.addColorStop(0.6, '#ffcf7a');
    core.addColorStop(1, '#f5a623');
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.fill();

    if(sun === hovered || sun === selected){
      ctx.strokeStyle = sun === selected ? '#ff8a65' : '#6fe3ff';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(cx, cy, r + 8, 0, Math.PI*2);
      ctx.stroke();
    }
  }

  function drawOrbit(radius, dashed){
    ctx.save();
    ctx.strokeStyle = dashed ? 'rgba(180,170,200,0.16)' : 'rgba(140,160,200,0.14)';
    ctx.lineWidth = 1;
    if(dashed) ctx.setLineDash([3, 5]);
    ctx.beginPath();
    ctx.ellipse(cx, cy, radius, radius*0.42, 0, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  function drawAsteroidBelt(){
    ctx.fillStyle = '#8a8a92';
    asteroids.forEach(a=>{
      if(!paused) a.angle += a.speed * speedMultiplier;
      const radius = a.baseRadius * scale;
      const x = cx + Math.cos(a.angle) * radius;
      const y = cy + Math.sin(a.angle) * radius * 0.42;
      ctx.globalAlpha = a.alpha;
      ctx.beginPath();
      ctx.arc(x, y, a.size * scale, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function drawPlanet(p){
    if(!paused) p.angle += p.baseSpeed * speedMultiplier;
    const rx = p.orbitAU * scale;
    const ry = rx * 0.42;
    const x = cx + Math.cos(p.angle) * rx;
    const y = cy + Math.sin(p.angle) * ry;
    p._x = x; p._y = y;
    const size = p.size * scale;

    // depth shading: planets "behind" sun (upper half of ellipse) drawn slightly dimmer
    const behind = Math.sin(p.angle) < 0;
    ctx.globalAlpha = behind ? 0.75 : 1;

    // ring for Saturn
    if(p.ring){
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-0.35);
      ctx.strokeStyle = 'rgba(232,213,163,0.55)';
      ctx.lineWidth = 2.5 * scale;
      ctx.beginPath();
      ctx.ellipse(0, 0, size*2.1, size*0.7, 0, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }

    const grad = ctx.createRadialGradient(x - size*0.3, y - size*0.3, 0.5, x, y, size);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.25, p.color);
    grad.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI*2);
    ctx.fill();

    // atmospheric bands for gas giants
    if(p.bands){
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI*2);
      ctx.clip();
      const stripes = 6;
      for(let i=0;i<stripes;i++){
        ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.09)';
        const stripeH = (size*2) / stripes;
        ctx.fillRect(x - size, y - size + i*stripeH, size*2, stripeH);
      }
      ctx.restore();
    }

    // day/night terminator shading, offset away from the sun
    {
      const dx = x - cx, dy = y - cy;
      const dist = Math.hypot(dx, dy) || 1;
      const nx = dx/dist, ny = dy/dist;
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI*2);
      ctx.clip();
      const shadow = ctx.createRadialGradient(
        x - nx*size*0.4, y - ny*size*0.4, size*0.15,
        x + nx*size*0.3, y + ny*size*0.3, size*1.15
      );
      shadow.addColorStop(0, 'rgba(0,0,0,0)');
      shadow.addColorStop(1, 'rgba(0,0,0,0.6)');
      ctx.fillStyle = shadow;
      ctx.fillRect(x - size, y - size, size*2, size*2);
      ctx.restore();
    }

    // the Moon, orbiting Earth
    if(p.moon){
      const moonAngle = time * 0.05;
      const moonOrbit = (size + 8*scale);
      const mx = x + Math.cos(moonAngle) * moonOrbit;
      const my = y + Math.sin(moonAngle) * moonOrbit * 0.6;
      moon._x = mx; moon._y = my;
      const moonSize = moon.size * scale;

      ctx.globalAlpha = 1;
      const mGrad = ctx.createRadialGradient(mx - 0.6, my - 0.6, 0.2, mx, my, moonSize);
      mGrad.addColorStop(0, '#ffffff');
      mGrad.addColorStop(1, '#9aa3b0');
      ctx.fillStyle = mGrad;
      ctx.beginPath();
      ctx.arc(mx, my, moonSize, 0, Math.PI*2);
      ctx.fill();

      if(moon === hovered || moon === selected){
        ctx.strokeStyle = moon === selected ? '#ff8a65' : '#6fe3ff';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(mx, my, moonSize + 3.5, 0, Math.PI*2);
        ctx.stroke();
      }
    }

    // highlight ring if hovered/selected
    if(p === hovered || p === selected){
      ctx.globalAlpha = 1;
      ctx.strokeStyle = p === selected ? '#ff8a65' : '#6fe3ff';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(x, y, size + 6, 0, Math.PI*2);
      ctx.stroke();
    }

    // label
    ctx.globalAlpha = (p === hovered || p === selected) ? 1 : 0.55;
    ctx.fillStyle = '#c7d0e0';
    ctx.font = '10px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.name, x, y + size + 14);
    ctx.globalAlpha = 1;
  }

  function frame(){
    ctx.clearRect(0, 0, W, H);
    drawStars();
    planets.forEach(p => drawOrbit(p.orbitAU * scale, p.dwarf));
    drawAsteroidBelt();
    drawSun();
    // sort by y for pseudo depth so far planets draw first
    const sorted = [...planets].sort((a,b)=> Math.sin(a.angle) - Math.sin(b.angle));
    sorted.forEach(drawPlanet);
    time += 1;
    requestAnimationFrame(frame);
  }

  frame();
})();
</script>
</body>
</html>
