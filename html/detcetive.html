<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Astra Detective</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
min-height:100vh;
background:radial-gradient(circle at top,#29233d,#07070b);
color:#fff;
font-family:Arial;
display:grid;
place-items:center;
}
#game{
width:min(850px,94vw);
text-align:center;
}
h1{color:#d8b4ff}
#scene{
position:relative;
height:390px;
overflow:hidden;
border:2px solid #60447d;
border-radius:15px;
background:
linear-gradient(#12121c 65%,#211b24 65%);
}
.room{
position:absolute;
inset:0;
}
.window{
position:absolute;
width:140px;
height:100px;
left:50%;
top:45px;
transform:translateX(-50%);
border:8px solid #5c4a67;
background:#151b2e;
}
.moon{
width:35px;
height:35px;
background:#eee;
border-radius:50%;
position:absolute;
right:20px;
top:15px;
}
.table{
position:absolute;
width:300px;
height:80px;
background:#543826;
left:50%;
bottom:55px;
transform:translateX(-50%);
border-radius:8px;
}
.lamp{
position:absolute;
left:75px;
bottom:100px;
font-size:60px;
}
.body{
position:absolute;
left:50%;
bottom:110px;
transform:translateX(-50%);
font-size:100px;
}
#clues{
display:flex;
gap:8px;
flex-wrap:wrap;
justify-content:center;
margin:12px 0;
}
button{
padding:11px 16px;
background:#20162d;
color:#fff;
border:1px solid #684889;
border-radius:8px;
cursor:pointer;
}
button:hover{background:#342047}
#log{
min-height:55px;
padding:10px;
color:#d7c7e7;
}
</style>
</head>

<body>

<div id="game">

<h1>🕵️ ASTRA DETECTIVE</h1>

<div id="scene">
<div class="room">
  <div class="window">
   <div class="moon"></div>
  </div>

  <div class="lamp">💡</div>

  <div class="table"></div>

  <div class="body">🕵️</div>
</div>
</div>

<div id="clues">
<button onclick="inspect('clock')">🕰️ Inspect Clock</button>
<button onclick="inspect('book')">📖 Inspect Book</button>
<button onclick="inspect('window')">🪟 Inspect Window</button>
<button onclick="inspect('table')">🗄️ Inspect Table</button>
</div>

<div id="log">
Find the clues and solve the mystery.
</div>

<button onclick="accuse()">🔎 Make Accusation</button>
<button onclick="restart()">🔄 New Case</button>

</div>

<script>

let found=[];
let solved=false;

const clues={
clock:"The clock stopped at 11:45. Someone deliberately stopped it.",
book:"A detective book has a missing page. The page was torn recently.",
window:"The window is locked from inside. The killer probably did not escape this way.",
table:"You found a tiny silver button under the table."
};

function inspect(item){

if(!found.includes(item))
  found.push(item);

document.getElementById("log").textContent=
  clues[item];
}

function accuse(){

if(found.length<3){

  document.getElementById("log").textContent=
   "You need more clues before making an accusation.";

  return;
}

const answer=prompt(
  "Who is the murderer?\n\n"+
  "1. The Butler\n"+
  "2. The Doctor\n"+
  "3. The Detective"
);

if(answer==="1"){

  solved=true;

  document.getElementById("log").textContent=
   "🎉 Correct! The silver button belonged to the Butler.";

}else{

  document.getElementById("log").textContent=
   "❌ Wrong accusation. The evidence points to the Butler.";
}
}

function restart(){

found=[];
solved=false;

document.getElementById("log").textContent=
  "Find the clues and solve the mystery.";
}

</script>

</body>
</html>
