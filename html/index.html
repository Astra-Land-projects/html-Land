<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

<script type="importmap">
{
    "imports": {
        "three": "./three.module.js"
    }
}
</script>

<script type="module">

    import * as THREE from "three";

    import { OrbitControls }
        from "./OrbitControls.js";


    const scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(0x000000);


    const camera =
        new THREE.PerspectiveCamera(
            60,
            window.innerWidth /
            window.innerHeight,
            0.1,
            1000
        );


    camera.position.set(
        0,
        4,
        10
    );


    const renderer =
        new THREE.WebGLRenderer({
            antialias: true
        });


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    document.body.appendChild(
        renderer.domElement
    );


    const controls =
        new OrbitControls(
            camera,
            renderer.domElement
        );


    controls.enableDamping =
        true;


    const geometry =
        new THREE.SphereGeometry(
            2,
            64,
            64
        );


    const material =
        new THREE.MeshBasicMaterial({
            color: 0xff5500
        });


    const sphere =
        new THREE.Mesh(
            geometry,
            material
        );


    scene.add(
        sphere
    );


    function animate() {

        requestAnimationFrame(
            animate
        );


        sphere.rotation.y +=
            0.01;


        controls.update();


        renderer.render(
            scene,
            camera
        );

    }


    animate();


    window.addEventListener(
        "resize",
        () => {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

        }
    );

</script>

</body>
</html>
