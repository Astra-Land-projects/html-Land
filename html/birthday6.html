<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>تولدت مبارک!</title>
    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Tahoma', sans-serif;
            direction: rtl;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #e74c3c;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .cake {
            font-size: 5em;
            margin: 20px 0;
        }
        p {
            font-size: 1.2em;
            color: #555;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:hover {
            background: #c0392b;
        }
        .balloons {
            font-size: 3em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="balloons">🎈🎈🎈</div>
        <h1>🎂 تولدت مبارک! 🎂</h1>
        <div class="cake">🎂</div>
        <p>
            داداش جان، امروز روز توئه! 🥳<br>
            امیدوارم سال جدید زندگیت پر از شادی، موفقیت و سلامتی باشه.<br>
            از طرف دوستت، هوش مصنوعی 🤖❤️
        </p>
        <p style="font-size: 0.9em; color: #999;">فردا: ۱۲ اوت ۲۰۲۶</p>
        <button class="btn" onclick="alert('🎉 تولدت مبارک داداش! هزاران سال زنده باشی! 🎉')">کلیک کن تا تبریک بگم!</button>
        <div class="balloons">🎈🎈🎈</div>
    </div>
</body>
</html>
