<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Notes — No Limits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1a1c22;
    --bg-panel: #202330;
    --bg-editor: #191b21;
    --border: rgba(255,255,255,0.08);
    --text: #e7e9f0;
    --text-dim: #8b8fa3;
    --text-faint: #5c6072;
    --accent: #e0a458;
    --accent-soft: rgba(224,164,88,0.14);
    --danger: #e0705a;
    --ok: #7fc98a;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background: var(--bg); color: var(--text); font-family:'Inter',sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .app{ display:flex; width:100%; height:100%; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width: 300px; min-width:300px; background: var(--bg-panel);
    border-right: 1px solid var(--border); display:flex; flex-direction:column;
  }
  .sidebar-header{ padding: 18px 16px 12px; }
  .brand{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px;
    display:flex; align-items:center; gap:8px; margin-bottom:14px;
  }
  .brand .dot{ width:7px; height:7px; border-radius:50%; background: var(--accent); }
  .search-row{ display:flex; gap:8px; }
  .search-input{
    flex:1; background: rgba(255,255,255,0.05); border:1px solid var(--border);
    border-radius:10px; padding: 9px 12px; color: var(--text); font-size:13px; outline:none;
  }
  .search-input::placeholder{ color: var(--text-faint); }
  .new-btn{
    width:36px; height:36px; border-radius:10px; border:1px solid var(--border);
    background: var(--accent-soft); color: var(--accent); font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .new-btn:hover{ background: rgba(224,164,88,0.24); }
  .new-btn:active{ transform: scale(0.94); }

  .note-list{ flex:1; overflow-y:auto; padding: 6px 10px 16px; }
  .note-item{
    padding: 12px 12px; border-radius:10px; cursor:pointer; margin-bottom:4px;
    border: 1px solid transparent;
  }
  .note-item:hover{ background: rgba(255,255,255,0.04); }
  .note-item.active{ background: var(--accent-soft); border-color: rgba(224,164,88,0.3); }
  .note-title{
    font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    margin-bottom:3px;
  }
  .note-item.active .note-title{ color: var(--accent); }
  .note-preview{
    font-size:11.5px; color: var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    margin-bottom:5px;
  }
  .note-meta{ font-size:10px; color: var(--text-faint); display:flex; justify-content:space-between; }
  .empty-list{ padding: 30px 16px; text-align:center; color: var(--text-faint); font-size:12.5px; line-height:1.6; }

  /* ---------- Editor ---------- */
  .editor{ flex:1; display:flex; flex-direction:column; background: var(--bg-editor); min-width:0; }
  .editor-topbar{
    display:flex; align-items:center; gap:10px; padding: 12px 20px;
    border-bottom: 1px solid var(--border);
  }
  .back-btn{
    display:none; width:32px; height:32px; border-radius:8px; border:1px solid var(--border);
    background: transparent; color: var(--text-dim); cursor:pointer; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .title-input{
    flex:1; background:none; border:none; outline:none; color: var(--text);
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; min-width:0;
  }
  .title-input::placeholder{ color: var(--text-faint); }
  .save-status{ font-size:11px; color: var(--text-faint); white-space:nowrap; flex-shrink:0; }
  .save-status.saved{ color: var(--ok); }

  .toolbar{
    display:flex; align-items:center; gap:8px; padding: 8px 20px;
    border-bottom: 1px solid var(--border); flex-wrap:wrap;
  }
  .tool-btn{
    display:flex; align-items:center; gap:5px; padding: 6px 11px; border-radius:8px;
    border:1px solid var(--border); background: rgba(255,255,255,0.03); color: var(--text-dim);
    font-size:11.5px; cursor:pointer;
  }
  .tool-btn:hover{ background: rgba(255,255,255,0.07); color: var(--text); }
  .tool-btn.on{ background: var(--accent-soft); color: var(--accent); border-color: rgba(224,164,88,0.3); }
  .tool-btn.danger:hover{ color: var(--danger); }
  .stat-pill{
    margin-left:auto; font-size:10.5px; color: var(--text-faint); display:flex; gap:10px;
    font-family:'JetBrains Mono', monospace;
  }

  .editor-body{ flex:1; overflow:hidden; position:relative; }
  .content-area{
    width:100%; height:100%; background:none; border:none; outline:none; resize:none;
    color: var(--text); font-family:'JetBrains Mono', monospace; font-size:13.5px; line-height:1.65;
    padding: 20px; white-space: pre; overflow: auto; tab-size:2;
  }
  .content-area.wrap{ white-space: pre-wrap; word-break: break-word; }

  .empty-editor{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    color: var(--text-faint); gap:10px; padding: 30px;
  }
  .empty-editor svg{ opacity:0.5; }
  .empty-editor-text{ font-size:13px; text-align:center; line-height:1.6; }

  @media (max-width: 760px){
    .sidebar{ width:100%; min-width:0; position:fixed; inset:0; z-index:5; }
    .sidebar.hidden-mobile{ display:none; }
    .editor{ position:fixed; inset:0; }
    .editor.hidden-mobile{ display:none; }
    .back-btn{ display:flex; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand"><span class="dot"></span>Notes</div>
      <div class="search-row">
        <input class="search-input" id="searchInput" placeholder="Search notes…">
        <button class="new-btn" id="newBtn" aria-label="New note">+</button>
      </div>
    </div>
    <div class="note-list" id="noteList"></div>
  </aside>

  <main class="editor" id="editorPane">
    <div id="emptyState" class="empty-editor">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9l-6-6Z" stroke="currentColor" stroke-width="1.4"/><path d="M14 3v6h6" stroke="currentColor" stroke-width="1.4"/></svg>
      <div class="empty-editor-text">No note selected.<br>Pick one on the left, or start a new one — no length limit, ever.</div>
    </div>

    <div id="editorContent" style="display:none; flex:1; flex-direction:column; min-height:0;">
      <div class="editor-topbar">
        <button class="back-btn" id="backBtn" aria-label="Back to list">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <input class="title-input" id="titleInput" placeholder="Untitled note">
        <span class="save-status" id="saveStatus"></span>
      </div>
      <div class="toolbar">
        <button class="tool-btn" id="wrapBtn">Wrap: Off</button>
        <button class="tool-btn" id="copyBtn">Copy</button>
        <button class="tool-btn" id="downloadBtn">Download .txt</button>
        <button class="tool-btn danger" id="deleteBtn">Delete</button>
        <span class="stat-pill" id="statPill">0 chars · 0 lines</span>
      </div>
      <div class="editor-body">
        <textarea class="content-area" id="contentArea" placeholder="Start typing — paste as much as you want."></textarea>
      </div>
    </div>
  </main>
</div>

<script>
(function(){

  /* =========================================================
     STORAGE — IndexedDB (no practical size ceiling like localStorage)
  ========================================================= */
  const DB_NAME = 'unlimited_notes_db';
  const STORE = 'notes';
  let dbPromise = null;

  function openDB(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject)=>{
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if(!db.objectStoreNames.contains(STORE)){
          db.createObjectStore(STORE, { keyPath: 'id' });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }
  async function dbGetAll(){
    const db = await openDB();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE, 'readonly');
      const store = tx.objectStore(STORE);
      const req = store.getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }
  async function dbPut(note){
    const db = await openDB();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(note);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  }
  async function dbDelete(id){
    const db = await openDB();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(id);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  }

  function makeId(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'n-' + Date.now() + '-' + Math.random().toString(36).slice(2, 9);
  }

  /* =========================================================
     STATE
  ========================================================= */
  let notes = [];          // in-memory list, mirrors DB
  let activeId = null;
  let saveTimer = null;
  let wrapEnabled = false;

  const noteList = document.getElementById('noteList');
  const searchInput = document.getElementById('searchInput');
  const newBtn = document.getElementById('newBtn');
  const emptyState = document.getElementById('emptyState');
  const editorContent = document.getElementById('editorContent');
  const titleInput = document.getElementById('titleInput');
  const contentArea = document.getElementById('contentArea');
  const saveStatus = document.getElementById('saveStatus');
  const statPill = document.getElementById('statPill');
  const wrapBtn = document.getElementById('wrapBtn');
  const copyBtn = document.getElementById('copyBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const deleteBtn = document.getElementById('deleteBtn');
  const backBtn = document.getElementById('backBtn');
  const sidebar = document.getElementById('sidebar');
  const editorPane = document.getElementById('editorPane');

  function fmtDate(ts){
    const d = new Date(ts);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    if(sameDay) return d.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
    return d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
  }

  function getActive(){ return notes.find(n => n.id === activeId) || null; }

  /* =========================================================
     RENDER
  ========================================================= */
  function renderList(){
    const q = searchInput.value.trim().toLowerCase();
    const filtered = notes
      .filter(n => !q || n.title.toLowerCase().includes(q) || n.content.toLowerCase().includes(q))
      .sort((a,b) => b.updatedAt - a.updatedAt);

    noteList.innerHTML = '';
    if(filtered.length === 0){
      noteList.innerHTML = `<div class="empty-list">${notes.length === 0 ? 'No notes yet. Tap + to create one.' : 'No matches.'}</div>`;
      return;
    }
    for(const n of filtered){
      const item = document.createElement('div');
      item.className = 'note-item' + (n.id === activeId ? ' active' : '');
      const preview = (n.content || '').replace(/\s+/g, ' ').trim().slice(0, 90) || 'Empty note';
      const chars = n.content ? n.content.length : 0;
      item.innerHTML = `
        <div class="note-title">${escapeHtml(n.title || 'Untitled note')}</div>
        <div class="note-preview">${escapeHtml(preview)}</div>
        <div class="note-meta"><span>${fmtDate(n.updatedAt)}</span><span>${chars.toLocaleString()} chars</span></div>
      `;
      item.addEventListener('click', () => selectNote(n.id));
      noteList.appendChild(item);
    }
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderStats(){
    const content = contentArea.value;
    const chars = content.length;
    const lines = content.length === 0 ? 0 : content.split('\n').length;
    statPill.textContent = `${chars.toLocaleString()} chars · ${lines.toLocaleString()} lines`;
  }

  function showEditor(show){
    emptyState.style.display = show ? 'none' : 'flex';
    editorContent.style.display = show ? 'flex' : 'none';
  }

  function selectNote(id){
    activeId = id;
    const n = getActive();
    if(!n){ showEditor(false); renderList(); return; }
    titleInput.value = n.title || '';
    contentArea.value = n.content || '';
    contentArea.classList.toggle('wrap', wrapEnabled);
    wrapBtn.textContent = 'Wrap: ' + (wrapEnabled ? 'On' : 'Off');
    wrapBtn.classList.toggle('on', wrapEnabled);
    saveStatus.textContent = '';
    saveStatus.classList.remove('saved');
    showEditor(true);
    renderStats();
    renderList();
    if(window.innerWidth <= 760){
      sidebar.classList.add('hidden-mobile');
      editorPane.classList.remove('hidden-mobile');
    }
  }

  /* =========================================================
     ACTIONS
  ========================================================= */
  async function createNote(){
    const n = { id: makeId(), title: '', content: '', createdAt: Date.now(), updatedAt: Date.now() };
    notes.push(n);
    await dbPut(n);
    selectNote(n.id);
    titleInput.focus();
  }

  function scheduleSave(){
    saveStatus.textContent = 'Saving…';
    saveStatus.classList.remove('saved');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async ()=>{
      const n = getActive();
      if(!n) return;
      n.title = titleInput.value;
      n.content = contentArea.value;
      n.updatedAt = Date.now();
      await dbPut(n);
      saveStatus.textContent = 'Saved';
      saveStatus.classList.add('saved');
      renderList();
    }, 450);
  }

  async function deleteActive(){
    const n = getActive();
    if(!n) return;
    notes = notes.filter(x => x.id !== n.id);
    await dbDelete(n.id);
    activeId = null;
    showEditor(false);
    renderList();
    if(window.innerWidth <= 760){
      sidebar.classList.remove('hidden-mobile');
      editorPane.classList.add('hidden-mobile');
    }
  }

  function downloadActive(){
    const n = getActive();
    if(!n) return;
    const blob = new Blob([n.content || ''], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (n.title || 'note').replace(/[^\w\-]+/g, '_') + '.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  async function copyActive(){
    const n = getActive();
    if(!n) return;
    try{
      await navigator.clipboard.writeText(n.content || '');
      copyBtn.textContent = 'Copied!';
      setTimeout(()=>{ copyBtn.textContent = 'Copy'; }, 1200);
    }catch(e){
      contentArea.select();
      document.execCommand('copy');
      copyBtn.textContent = 'Copied!';
      setTimeout(()=>{ copyBtn.textContent = 'Copy'; }, 1200);
    }
  }

  /* =========================================================
     EVENTS
  ========================================================= */
  newBtn.addEventListener('click', createNote);
  searchInput.addEventListener('input', renderList);

  titleInput.addEventListener('input', scheduleSave);
  contentArea.addEventListener('input', ()=>{ renderStats(); scheduleSave(); });

  wrapBtn.addEventListener('click', ()=>{
    wrapEnabled = !wrapEnabled;
    contentArea.classList.toggle('wrap', wrapEnabled);
    wrapBtn.textContent = 'Wrap: ' + (wrapEnabled ? 'On' : 'Off');
    wrapBtn.classList.toggle('on', wrapEnabled);
  });
  copyBtn.addEventListener('click', copyActive);
  downloadBtn.addEventListener('click', downloadActive);
  deleteBtn.addEventListener('click', deleteActive);
  backBtn.addEventListener('click', ()=>{
    sidebar.classList.remove('hidden-mobile');
    editorPane.classList.add('hidden-mobile');
  });

  window.addEventListener('keydown', (e)=>{
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n'){
      e.preventDefault();
      createNote();
    }
  });

  /* =========================================================
     INIT
  ========================================================= */
  async function init(){
    if(window.innerWidth <= 760){
      editorPane.classList.add('hidden-mobile');
    }
    try{
      notes = await dbGetAll();
    }catch(e){
      notes = [];
    }
    renderList();
    showEditor(false);
  }
  init();

})();
</script>
</body>
</html>
