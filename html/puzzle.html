<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Astra Puzzle Adventure</title>

<style>
*{
box-sizing:border-box;
user-select:none
}

body{
margin:0;
min-height:100vh;
background:
radial-gradient(circle at top,#30234d,#07070c);
color:white;
font-family:Arial;
display:grid;
place-items:center
}

#box{
width:min(800px,95vw);
text-align:center
}

h1{
color:#d0a6ff
}

#info{
margin:10px
}

#puzzle{
width:min(500px,90vw);
aspect-ratio:1;
margin:auto;

display:grid;
grid-template-columns:repeat(3,1fr);
gap:5px;

background:#16111f;
padding:5px;
border-radius:12px;
}

.tile{
display:grid;
place-items:center;

background:
linear-gradient(135deg,#7447a8,#3b2860);

border-radius:8px;

font-size:35px;
font-weight:bold;

cursor:pointer;

transition:.15s;
}

.tile:hover{
transform:scale(.96)
}

.empty{
background:#08080d;
}

button{
padding:11px 22px;
margin:12px 5px;

border:0;
border-radius:8px;

background:#291b40;
color:white;

font-weight:bold;
}
</style>
</head>

<body>

<div id="box">

<h1>🧩 ASTRA PUZZLE ADVENTURE</h1>

<div id="info">
Moves: <span id="moves">0</span>
&nbsp; | &nbsp;
Level: <span id="level">1</span>
</div>

<div id="puzzle"></div>

<button onclick="restart()">🔄 Restart</button>

</div>

<script>

const puzzle=document.getElementById("puzzle");

let tiles=[];
let empty=8;
let moves=0;
let level=1;

function shuffle(){

for(let i=0;i<100;i++){

  const possible=getMoves();

  const choice=
   possible[
    Math.floor(
     Math.random()*possible.length
    )
   ];

  swap(empty,choice);
  empty=choice;
}
}

function getMoves(){

const result=[];

const row=Math.floor(empty/3);
const col=empty%3;

if(row>0)
  result.push(empty-3);

if(row<2)
  result.push(empty+3);

if(col>0)
  result.push(empty-1);

if(col<2)
  result.push(empty+1);

return result;
}

function swap(a,b){

const temp=tiles[a];

tiles[a]=tiles[b];

tiles[b]=temp;
}

function draw(){

puzzle.innerHTML="";

tiles.forEach((value,i)=>{

  const tile=document.createElement("div");

  tile.className=
   "tile"+(value===0?" empty":"");

  if(value!==0)
   tile.textContent=value;

  tile.onclick=()=>move(i);

  puzzle.appendChild(tile);
});
}

function move(index){

if(!getMoves().includes(index))
  return;

swap(empty,index);

empty=index;

moves++;

draw();

update();

if(isWin()){

  setTimeout(()=>{

   alert(
    `🎉 Level ${level} Complete!\nMoves: ${moves}`
   );

   level++;

   restart();

  },150);
}
}

function isWin(){

for(let i=0;i<8;i++){

  if(tiles[i]!==i+1)
   return false;
}

return tiles[8]===0;
}

function restart(){

tiles=[
  1,2,3,
  4,5,6,
  7,8,0
];

empty=8;
moves=0;

shuffle();

draw();
update();
}

function update(){

document.getElementById(
  "moves"
).textContent=moves;

document.getElementById(
  "level"
).textContent=level;
}

restart();

</script>

</body>
</html>
