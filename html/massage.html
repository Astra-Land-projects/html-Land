<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Interactive Birthday Gift — Three.js</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#0c171c;font-family:Arial,sans-serif;color:white}
#stage{position:fixed;inset:0;display:grid;place-items:center}
#card{position:relative;width:min(88vw,1100px);height:min(62vw,620px);max-height:76vh;overflow:hidden;border:2px solid #fff;border-radius:4px;background:#fff7f0;box-shadow:0 20px 80px #0008}
#card canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#shade{position:absolute;inset:0;pointer-events:none;background:
 radial-gradient(circle at 52% 34%,#ffd1db99 0,#ffdfe500 24%),
 radial-gradient(circle at 28% 85%,#ffd4c366 0,transparent 42%),
 linear-gradient(180deg,#fffaf6,#fff1e8)}
#top{position:absolute;z-index:4;top:9%;left:0;right:0;text-align:center;color:#7f5b61;font:italic 14px Georgia,serif}
#wish{position:absolute;z-index:5;left:5%;bottom:9%;max-width:48%;opacity:0;transition:opacity 1.3s}
#wish .and{font:italic 15px Georgia,serif;color:#79545b}
#wish h1{font:italic normal clamp(38px,6vw,74px)/.88 Georgia,serif;color:#b63c5e;margin:5px 0 10px;text-shadow:0 2px 0 #fff}
#wish .line{width:65px;height:2px;background:#d49b62;margin:0 0 8px}
#wish p{font:italic 13px Georgia,serif;color:#8a6a6d;margin:0}
#hint{position:absolute;z-index:5;bottom:5%;left:0;right:0;text-align:center;color:#a38483;font:10px Georgia,serif;letter-spacing:3px}
#bow{position:absolute;z-index:8;left:12%;bottom:12%;width:145px;height:105px;cursor:grab;touch-action:none;transition:opacity .7s}
#bow:active{cursor:grabbing}
#bow svg{width:100%;height:100%;overflow:visible}
#heartGlow{position:absolute;z-index:3;left:50%;top:34%;width:190px;height:150px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#ffb6c899 0,#ffb0c844 28%,transparent 70%);filter:blur(13px);pointer-events:none}
#burst{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:0}
#startHeart{position:absolute;z-index:7;left:50%;top:34%;width:84px;height:76px;transform:translate(-50%,-50%) rotate(-45deg);border-radius:15px;background:linear-gradient(145deg,#ff7b9e,#e82058 72%);box-shadow:0 0 38px #ff668f;cursor:pointer;transition:.7s}
#startHeart:before,#startHeart:after{content:"";position:absolute;width:84px;height:76px;border-radius:50%;background:inherit}
#startHeart:before{top:-38px;left:0}#startHeart:after{left:38px;top:0}
#startHeart i{position:absolute;z-index:3;width:20px;height:13px;border-radius:50%;background:#fff9;top:7px;left:9px;filter:blur(1px)}
#treeText{display:none}
#externalTitle{position:fixed;top:7vh;left:0;right:0;text-align:center;font:bold clamp(28px,4.5vw,60px) Arial,sans-serif;letter-spacing:-2px}
#externalTitle span{color:#a9f05a}
#credit{position:fixed;bottom:1.6vh;left:0;right:0;text-align:center;color:#758187;font:11px ui-monospace,monospace;letter-spacing:1px}
@media(max-width:700px){#card{width:94vw;height:64vw;max-height:70vh}#externalTitle{top:2.5vh}#bow{transform:scale(.75);transform-origin:left bottom;left:6%;bottom:10%}#wish{left:4%;bottom:8%;max-width:58%}}
</style>
</head>
<body>
<div id="externalTitle">Interactive <span>Birthday Gift</span></div>
<div id="stage">
 <div id="card">
  <canvas id="scene"></canvas><div id="shade"></div>
  <div id="top">a little something, for you</div>
  <div id="heartGlow"></div><div id="startHeart"><i></i></div>
  <div id="burst"></div>
  <div id="wish"><div class="and">and... make it count</div><h1>Happy Birthday</h1><div class="line"></div><p>here's to a year that blooms</p></div>
  <div id="hint">PULL &amp; RELEASE</div>
  <div id="bow">
   <svg viewBox="0 0 180 130">
    <path d="M28 18 Q4 64 32 111" fill="none" stroke="#4e2b26" stroke-width="3"/>
    <path d="M28 18 L154 61 L32 111" fill="none" stroke="#4e2b26" stroke-width="2"/>
    <line id="arrow" x1="27" y1="65" x2="154" y2="65" stroke="#5b332b" stroke-width="4" stroke-linecap="round"/>
    <path d="M148 58 L160 65 L148 72" fill="none" stroke="#5b332b" stroke-width="3"/>
    <path d="M35 62 L24 52 M35 68 L24 78" stroke="#d04767" stroke-width="3"/>
    <circle cx="29" cy="65" r="5" fill="#cf4b65"/>
   </svg>
  </div>
 </div>
</div>
<div id="credit">THREE.JS · DRAG THE ARROW · MAKE A WISH</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const cvs=document.getElementById('scene'), card=document.getElementById('card');
const renderer=new THREE.WebGLRenderer({canvas:cvs,antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(card.clientWidth,card.clientHeight,false);
renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.25;

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(32,card.clientWidth/card.clientHeight,.1,100);
camera.position.set(0,0,18);
scene.add(new THREE.AmbientLight(0xffffff,2));
const key=new THREE.PointLight(0xffd2dc,18,30);key.position.set(-3,5,8);scene.add(key);

let mode='start', pull=0, dragging=false;
const clock=new THREE.Clock();

// Tiny atmospheric petals
const PET=180, pp=new Float32Array(PET*3), pv=new Float32Array(PET*3);
for(let i=0;i<PET;i++){pp[i*3]=(Math.random()-.5)*16;pp[i*3+1]=(Math.random()-.5)*8;pp[i*3+2]=(Math.random()-.5)*5;pv[i*3]=(Math.random()-.5)*.01;pv[i*3+1]=.004+Math.random()*.009;pv[i*3+2]=(Math.random()-.5)*.006}
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
const pm=new THREE.PointsMaterial({color:0xffb3c4,size:.055,transparent:true,opacity:.45,depthWrite:false});
const ambient=new THREE.Points(pg,pm);scene.add(ambient);

// Tree
const tree=new THREE.Group();tree.visible=false;scene.add(tree);
const trunkMat=new THREE.MeshStandardMaterial({color:0x542c2c,roughness:.9});
function branch(a,b,r1,r2){
 const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=B.clone().sub(A),m=A.clone().add(B).multiplyScalar(.5);
 const q=new THREE.Mesh(new THREE.CylinderGeometry(r2,r1,d.length(),12),trunkMat);
 q.position.copy(m);q.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());tree.add(q);
}
branch([3.2,-5,0],[3.1,-.9,0],.34,.22);
branch([3.1,-1,0],[2.0,1.5,0],.22,.13);
branch([3.1,-1,0],[4.25,1.6,0],.22,.13);
branch([2.15,1.45,0],[1.25,3.0,0],.13,.07);
branch([2.15,1.45,0],[2.55,3.15,.1],.13,.07);
branch([4.2,1.5,0],[4.9,3.1,0],.13,.07);
branch([4.2,1.5,0],[5.25,2.7,0],.13,.06);

// Blossoms: each is a small 3D cluster of five petals + center.
// They start at the trunk and fly into a heart silhouette.
const N=1100, positions=new Float32Array(N*3), target=new Float32Array(N*3), rot=new Float32Array(N);
const flowerColors=[0xff5d89,0xff8fab,0xffb7c8,0xffca64,0xf04d75,0xffffff];
const dummy=new THREE.Object3D(), inst=new THREE.InstancedMesh(new THREE.SphereGeometry(.105,8,8),new THREE.MeshStandardMaterial({roughness:.35,metalness:.02}),N);
tree.add(inst);
const tc=new THREE.Color();
for(let i=0;i<N;i++){
 const t=Math.random()*Math.PI*2;
 const heartX=3.35*Math.pow(Math.sin(t),3);
 const heartY=2.6*Math.cos(t)-1.05*Math.cos(2*t)-.5*Math.cos(3*t)-.22*Math.cos(4*t);
 const fill=.52+Math.sqrt(Math.random())*.58;
 const x=3.05+heartX*fill+(Math.random()-.5)*.55;
 const y=2.35+heartY*fill+(Math.random()-.5)*.52;
 const z=(Math.random()-.5)*1.25;
 target[i*3]=x;target[i*3+1]=y;target[i*3+2]=z;
 positions[i*3]=3.1+(Math.random()-.5)*.2;positions[i*3+1]=-.2+(Math.random()-.5)*.3;positions[i*3+2]=(Math.random()-.5)*.2;
 rot[i]=Math.random()*6.28;
 tc.setHex(flowerColors[(Math.random()*flowerColors.length)|0]);inst.setColorAt(i,tc);
}
inst.instanceColor.needsUpdate=true;

// Use tiny petal groups on some blossoms to make the crown visibly floral.
const flowerGroup=new THREE.Group();tree.add(flowerGroup);
for(let i=0;i<220;i++){
 const g=new THREE.Group(), col=new THREE.Color(flowerColors[(Math.random()*flowerColors.length)|0]);
 const mat=new THREE.MeshStandardMaterial({color:col,roughness:.5});
 for(let j=0;j<5;j++){
   const pet=new THREE.Mesh(new THREE.SphereGeometry(.14,8,8),mat);
   const a=j*Math.PI*2/5;pet.position.set(Math.cos(a)*.13,Math.sin(a)*.13,0);pet.scale.set(1,.62,.42);g.add(pet);
 }
 const core=new THREE.Mesh(new THREE.SphereGeometry(.06,8,8),new THREE.MeshStandardMaterial({color:0xffc24e}));
 g.add(core);
 const idx=(Math.random()*N)|0;g.userData.idx=idx;flowerGroup.add(g);
}

// Sparkle points around blossoms
const SN=1300,sp=new Float32Array(SN*3),sc=new Float32Array(SN*3);
for(let i=0;i<SN;i++){
 sp[i*3]=3+(Math.random()-.5)*5.7;sp[i*3+1]=2.5+(Math.random()-.5)*4.8;sp[i*3+2]=(Math.random()-.5)*1.8;
 sc[i*3]=1;sc[i*3+1]=.55+.35*Math.random();sc[i*3+2]=.7+.25*Math.random();
}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp,3));sg.setAttribute('color',new THREE.BufferAttribute(sc,3));
const spark=new THREE.Points(sg,new THREE.PointsMaterial({size:.035,vertexColors:true,transparent:true,opacity:.75,blending:THREE.AdditiveBlending,depthWrite:false}));
tree.add(spark);

// Pull interaction
const bow=document.getElementById('bow'), arrow=document.getElementById('arrow'), startHeart=document.getElementById('startHeart');
function pointerX(e){return e.clientX ?? e.touches?.[0]?.clientX ?? 0}
function down(e){if(mode!=='start')return;dragging=true;bow.setPointerCapture?.(e.pointerId);startHeart.style.pointerEvents='none'}
function move(e){
 if(!dragging||mode!=='start')return;
 const x=pointerX(e), rect=card.getBoundingClientRect(), local=x-rect.left;
 const bowBase=rect.width*.18;
 pull=Math.max(0,Math.min(1,(bowBase-local)/110));
 arrow.setAttribute('x2',154-pull*65);
 arrow.setAttribute('y1',65+pull*3);arrow.setAttribute('y2',65-pull*3);
}
function up(){if(!dragging)return;dragging=false;if(pull>.55)release();else{pull=0;arrow.setAttribute('x2','154');arrow.setAttribute('y1','65');arrow.setAttribute('y2','65')}}
bow.addEventListener('pointerdown',down);bow.addEventListener('pointermove',move);bow.addEventListener('pointerup',up);
startHeart.addEventListener('click',release);

function release(){
 if(mode!=='start')return;mode='burst';
 bow.style.opacity='0';startHeart.style.transform='translate(-50%,-50%) rotate(-45deg) scale(.15)';startHeart.style.opacity='0';
 document.getElementById('hint').style.opacity='0';
 // sound: a tiny self-contained whoosh + chime, no external assets
 try{
  const A=new AudioContext(),o=A.createOscillator(),g=A.createGain();
  o.type='sine';o.frequency.setValueAtTime(220,A.currentTime);o.frequency.exponentialRampToValueAtTime(880,A.currentTime+.5);
  g.gain.setValueAtTime(.0001,A.currentTime);g.gain.exponentialRampToValueAtTime(.09,A.currentTime+.03);g.gain.exponentialRampToValueAtTime(.0001,A.currentTime+.65);
  o.connect(g).connect(A.destination);o.start();o.stop(A.currentTime+.7);
 }catch(e){}
 setTimeout(()=>{tree.visible=true;mode='bloom';},650);
 setTimeout(()=>{document.getElementById('wish').style.opacity='1';},2600);
}

// Animation
function animate(){
 requestAnimationFrame(animate);const t=clock.getElapsedTime();
 for(let i=0;i<PET;i++){pp[i*3]+=pv[i*3];pp[i*3+1]+=pv[i*3+1];pp[i*3+2]+=pv[i*3+2];if(pp[i*3+1]>5){pp[i*3+1]=-5}}
 pg.attributes.position.needsUpdate=true;
 if(mode==='bloom'||mode==='final'){
  const k=Math.min(1,(t-1.0)/2.5), ease=1-Math.pow(1-k,3);
  for(let i=0;i<N;i++){
   const q=i*3;
   positions[q]+=(target[q]-positions[q])*.035;
   positions[q+1]+=(target[q+1]-positions[q+1])*.035;
   positions[q+2]+=(target[q+2]-positions[q+2])*.035;
   dummy.position.set(positions[q],positions[q+1],positions[q+2]);
   const pulse=1+Math.sin(t*2+i*.17)*.055;
   dummy.scale.setScalar(pulse);dummy.rotation.z=rot[i]+t*.12;dummy.updateMatrix();inst.setMatrixAt(i,dummy.matrix);
  }
  inst.instanceMatrix.needsUpdate=true;
  flowerGroup.children.forEach((g,j)=>{
   const idx=g.userData.idx,q=idx*3;g.position.set(positions[q],positions[q+1],positions[q+2]);g.rotation.z+=.002;
  });
  if(k>0){document.getElementById('wish').style.opacity=Math.min(1,(t-3.0)/1.2)}
 }
 if(mode==='start'){
  const s=1+Math.sin(t*2.1)*.035;startHeart.style.transform=`translate(-50%,-50%) rotate(-45deg) scale(${s})`;
 }
 renderer.render(scene,camera);
}
animate();

function resize(){const w=card.clientWidth,h=card.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);
</script>
</body>
</html>
